const sourceForStage = (channel,index) => index<3?"Meta Ads":channel==="wa"?"Chat WhatsApp":"Meta Pixel";
const originForStage = (channel,index) => channel==="wa"&&index===5?"Indikasi dari chat":sourceForStage(channel,index);
const stageData = channel => sumStages(channelScope(channel)).slice(1);
const channelTabs = () => tabRow([["wa","WhatsApp"],["web","Website"]],state.channel,"channel");

function leakDiagnosis(channel,current,evidence) {
  return channel==="wa" ? `<div class="detail-metrics"><div><span>Konversi sekarang</span><strong>${pct(evidence.actual)}</strong></div><div><span>Periode sebelumnya</span><strong>${pct(evidence.baseline)}</strong></div><div><span>Perkiraan selisih chat</span><strong>${num(evidence.loss)}</strong></div></div>
    ${explanation(`Bandingkan rasio klik ke percakapan per campaign. Mulai dengan memeriksa tautan dan pesan pembuka pada campaign dengan rasio terendah.`)}` :
    `<div class="detail-metrics"><div><span>Klik link</span><strong>${num(current[1])}</strong></div><div><span>Landing page view</span><strong>${num(current[2])}</strong></div><div><span>Rasio pemuatan</span><strong>${pct(evidence.actual)}</strong></div></div>${explanation("Event Pixel tersedia pada snapshot. Selisih klik dan pemuatan dapat dipakai untuk menentukan halaman mana yang perlu diperiksa.")}`;
}

function stageRate(value, base) {
  return base > 0 ? value / base : null;
}
function formatStageRate(rate, detail=false) {
  if (rate === null) return "—";
  if (rate === 0) return "0%";
  if (rate < .001) return detail ? num(rate * 100, 4) + "%" : "<0,1%";
  return pct(rate);
}
function formatPointChange(change) {
  const size = Math.abs(change);
  if (size < 1e-8) return "Stabil";
  return (change < 0 ? "Turun " : "Naik ") + (size < .1 ? "<0,1" : num(size,1)) + " poin";
}
function funnelStages(channel) {
  const totals = stageData(channel);
  const previous = sumStages(channelScope(channel),state.days).slice(1);
  return totals.map((count,index)=>{
    const rate = index ? stageRate(count,totals[index-1]) : null;
    const baseline = index ? stageRate(previous[index],previous[index-1]) : null;
    return {index,count,rate,baseline,previousCount:previous[index],share:stageRate(count,totals[0]),
      change:rate === null || baseline === null ? null : (rate-baseline)*100};
  });
}
function largestDecline(stages) {
  return stages.reduce((worst,stage)=> stage.change !== null && stage.change < (worst?.change ?? -1e-8) ? stage : worst,null);
}
function leakHistory(list) {
  const availableDays=Math.min(...list.map(campaign=>dailyRows[campaign.id].length));
  const periods=Math.min(4,Math.floor(availableDays/state.days));
  const dates=new Intl.DateTimeFormat("id-ID",{day:"numeric",month:"short",timeZone:"UTC"});
  return Array.from({length:periods},(_,index)=>{
    const offset=state.days*(periods-index-1);
    const start=new Date(Date.UTC(2026,10,20-state.days-offset));
    const end=new Date(Date.UTC(2026,10,19-offset));
    return {label:dates.formatRange(start,end),counts:sumStages(list,offset).slice(1),current:offset===0};
  });
}
function leakHistoryChart(history,index) {
  const values=history.map(({counts})=>index===0?counts[0]:stageRate(counts[index],counts[index-1]));
  const scale=index===0?Math.max(1,...values):1;
  const title=index===0?"Tayangan per periode":"Konversi per periode";
  const bars=history.map(({label,current},period)=>{
    const value=values[period];
    const formatted=index===0?num(value):formatStageRate(value,true);
    const height=100*Math.max(0,Math.min(1,(value??0)/scale));
    return `<span class="leak-history-period${current?" is-current":""}" role="listitem">
      <span class="leak-history-value">${safe(formatted)}</span>
      <span class="leak-history-track" aria-hidden="true"><span class="leak-history-bar" style="--height:${height}%"></span></span>
      <span class="leak-history-date">${safe(label)}${current?'<span class="sr">, periode ini</span>':""}</span>
    </span>`;
  }).join("");
  return `<span class="leak-history"><span class="leak-history-title">${title}</span>
    <span class="leak-history-grid" role="list" aria-label="${title}" style="--leak-periods:${history.length}">${bars}</span></span>`;
}
function leakageChart(channel,list) {
  const names=stageNames[channel];
  const tabs=tabRow([["wa","WhatsApp","message-circle"],["web","Website","globe"]],channel,"channel","Jalur funnel");
  const heading=`<header class="leak-panel-header">
    <div><h2 id="leak-chart-title">Alur konversi ${channelName(channel)}</h2><p>${selectedPeriod().label} dibanding ${previousPeriodLabel()}</p></div>${tabs}</header>`;
  if (!list.length) return `<section class="leak-panel" aria-labelledby="leak-chart-title">${heading}
    ${empty("Campaign tidak memakai jalur ini","Ganti jalur atau pilih semua campaign.",button("Tampilkan semua campaign","reset-filter"))}</section>`;

  const stages=funnelStages(channel);
  const history=leakHistory(list);
  const priority=largestDecline(stages);
  const transition=priority ? `${names[priority.index-1]} → ${names[priority.index]}` : "";
  const impressionsScale=Math.max(1,stages[0].count,stages[0].previousCount);
  const stagesMarkup=stages.map(stage=>{
    const {index,count,previousCount,rate,baseline,change}=stage;
    const isEntry=index===0;
    const scale=isEntry?impressionsScale:1;
    const scaled=value=>100*Math.max(0,Math.min(1,(value??0)/scale));
    const pair=`<span class="leak-step-pair" aria-hidden="true">
      <i style="--height:${scaled(isEntry?count:rate)}%"></i><i class="prior" style="--height:${scaled(isEntry?previousCount:baseline)}%"></i></span>`;
    const value=isEntry?num(previousCount):formatStageRate(rate);
    const caption=isEntry?"Tayangan periode lalu":change===null?"Tanpa pembanding":formatPointChange(change);
    const detail=isEntry
      ? `periode ini, ${value} tayangan periode lalu`
      : `${value} dari ${names[index-1]}, pembanding ${formatStageRate(baseline)}, ${caption}`;
    return `<li><button type="button" class="leak-step ${stage===priority?"is-priority":""}" data-stage="${index}" data-stage-history
      aria-label="${safe(`Buka detail ${names[index]}, ${num(count)}, ${detail}`)}">
      <span class="leak-step-name">${names[index]}</span><strong class="leak-step-count">${num(count)}</strong>
      <span class="leak-step-compact">${pair}
        <span><span class="leak-step-rate">${safe(value)}</span><br><span class="leak-step-caption">${safe(caption)}</span></span>
      </span>${leakHistoryChart(history,index)}
    </button></li>`;
  }).join("");
  const chart=`<section class="leak-panel leak-chart" aria-labelledby="leak-chart-title">${heading}
    <ol class="leak-stages" aria-label="Tahap funnel">${stagesMarkup}</ol>
    <div class="leak-legend"><span><i class="ov-dot" aria-hidden="true"></i>Periode ini</span><span><i class="ov-dot prior" aria-hidden="true"></i>Periode lalu</span><span>Tayangan 0–${num(impressionsScale)} · Tahap lain 0–100% dari tahap sebelumnya</span></div>
  </section>`;
  const highlight=priority
    ? `<h3>${transition}</h3><strong class="leak-delta">${safe(formatPointChange(priority.change).replace(" poin"," pp"))}</strong>
       <p class="leak-delta-label">Poin persentase dibanding periode lalu</p>
       <dl class="leak-metrics"><div><dt>Periode ini</dt><dd>${safe(formatStageRate(priority.rate))}</dd></div>
       <div><dt>Periode lalu</dt><dd>${safe(formatStageRate(priority.baseline))}</dd></div></dl>
       <button class="button primary" type="button" data-stage="${priority.index}" data-stage-history>Lihat detail tahap</button>`
    : `<p class="ov-empty-note">Belum ada tahap dengan penurunan konversi yang terukur.</p>`;
  const stageToCompare=priority?.index??2;
  const comparisonTitle=transition||`${names[stageToCompare-1]} → ${names[stageToCompare]}`;
  return `<div class="leak-workspace">${chart}
    <section class="leak-panel blue leak-highlight"><header class="leak-panel-header"><h2>Penurunan terbesar</h2></header>${highlight}</section>
    <div class="leak-lower">${leakageCampaignComparison(list,stageToCompare,comparisonTitle)}${leakageChecks(channel,stageToCompare)}</div>
    ${leakageDataSources(channel)}
  </div>`;
}

function leakageCampaignComparison(list,index,title) {
  const rows=list.map(campaign=>{
    const current=stageTotals(campaign,state.days);
    const prior=stageTotals(campaign,state.days,state.days);
    const rate=stageRate(current[index+1],current[index]);
    const baseline=stageRate(prior[index+1],prior[index]);
    const change=rate===null||baseline===null?null:(rate-baseline)*100;
    return {campaign,rate,baseline,change};
  }).sort((a,b)=>(a.change??Infinity)-(b.change??Infinity));
  return `<section class="leak-panel"><header class="leak-panel-header"><div><h2>Perbandingan per campaign</h2><p>${title}</p></div></header>
    <ul class="leak-campaign">${rows.map(({campaign,rate,baseline,change})=>`<li><b>${safe(campaign.name)}</b>
      <p class="leak-campaign-metrics"><strong>${safe(formatStageRate(rate))}</strong><span>vs ${safe(formatStageRate(baseline))}</span>
        <span>· ${change===null?"Tanpa pembanding":safe(formatPointChange(change))}</span></p></li>`).join("")}</ul>
  </section>`;
}

function funnelPage() {

    return `<button type="button" class="stage ${stage===priority?"leak-stage":""}" data-stage="${index}"><span class="stage-name">${names[index]}</span><strong>${num(count)}</strong>${icon("chevron-right")}<span class="stage-meta">${originForStage(channel,index)}${conversion}</span></button>`;
  }).join("");

  const context = channel==="wa"
    ? panel("Dari chat ke keputusan","Tonggak Warm dan Hot memakai pencapaian pertama.",`<div class="panel-body">${info("Indikasi closing berasal dari percakapan WhatsApp.")}<div class="button-row"><a class="button secondary" href="#kecepatan">${icon("clock-3")} Kecepatan & respons</a><a class="button secondary" href="#pipeline">${icon("users")} Lihat pipeline lead</a></div></div>`)
    : panel("Cakupan event","Jalur contoh untuk objective penjualan.",`<div class="panel-body">${info("Pixel menampilkan hitungan agregat per event. Tahap yang tersedia mengikuti event campaign.")}</div>`);
  return channelTabs()+split(panel("Tahap funnel",channel==="wa"?"Meta Ads dan chat WhatsApp":"Meta Ads dan event Pixel agregat",`<div class="stages">${stages}</div>`),panel("Titik yang perlu ditinjau",channel==="wa"?"Konversi klik → percakapan":"Konversi klik → pemuatan halaman",`<div class="panel-body">${diagnosis}<a class="text-button" href="#kebocoran">Lihat deteksi kebocoran ${icon("chevron-right")}</a></div>`))+context;

function levelBadge(level) {

function conversationTrail(lead) {

const leadTemperatures=["Semua","Cold","Warm","Hot"];
const leadTemperatureRank={Cold:0,Warm:1,Hot:2};
const leadComparators={
  name:(a,b)=>a.alias.localeCompare(b.alias,"id",{numeric:true}),
  response:(a,b)=>a.date.localeCompare(b.date),
  temperature:(a,b)=>leadTemperatureRank[a.level]-leadTemperatureRank[b.level],
  analysis:(a,b)=>a.status.localeCompare(b.status,"id"),
  campaign:(a,b)=>campaignName(a.campaign).localeCompare(campaignName(b.campaign),"id")
};

function leadListView(records) {
  const query=state.leadSearch.trim().toLocaleLowerCase("id");
  const matches=records.filter(lead=>
    (state.leadLevel==="Semua"||lead.level===state.leadLevel)
    && [lead.id,lead.alias,lead.topic,lead.type,campaignName(lead.campaign)].join(" ").toLocaleLowerCase("id").includes(query)
  ).sort((a,b)=>state.leadSortDirection*leadComparators[state.leadSort](a,b)||leadComparators.response(b,a));
  const pages=Math.max(1,Math.ceil(matches.length/state.leadPageSize));
  state.leadPage=Math.min(state.leadPage,pages);
  const start=(state.leadPage-1)*state.leadPageSize;
  return {total:matches.length,start,rows:matches.slice(start,start+state.leadPageSize),pages};
}

function leadResultCount(view) {
  if (view.total===1) return "1 lead";
  return view.total
    ? `${num(view.start+1)}–${num(view.start+view.rows.length)} dari ${num(view.total)} lead`

}

    </tr></thead><tbody>${rows}</tbody></table></div>${pagination}`;
}

function conversations() {
  const records=visibleLeads();
  if (!records.length) return empty("Belum ada sampel chat","Pilih campaign WhatsApp atau periode lain.");
  const breakdown=responseTypes.map(type=>({type,count:records.filter(lead=>lead.type===type).length}));
  const measured=records.filter(lead=>lead.minutes!==null);
  return split(panel("Jenis respons","Tujuh jenis jawaban lead yang dipakai dalam analisis",`<div class="panel-body"><div class="breakdown">${breakdown.map(({type,count})=>`<div><span>${type}</span><div class="meter"><i style="--size:${100*ratio(count,records.length)}%"></i></div><strong>${count}</strong></div>`).join("")}</div>
    <section class="conversation-summary response-summary" aria-label="Ringkasan jenis respons">${explanation(responseSummary(records.length,breakdown))}</section></div>`),
    panel("Jeda balasan & sentimen","Pesan CS → jawaban lead",`<div class="panel-body">${measured.map(l=>`<button class="movement-item" data-lead="${l.id}"><span>${l.alias}</span><span>${l.minutes} mnt · ${l.mood}</span>${icon("chevron-right")}</button>`).join("")}${info("Cakupan interval bergantung pada ketersediaan pesan keluar CS.")}</div>`))
    +`<section class="conversation-summary" aria-label="Ringkasan percakapan">${explanation(conversationSummary(records,measured))}</section>`;
}
function responseSummary(total,breakdown) {
  const max=Math.max(...breakdown.map(item=>item.count));
  const top=breakdown.filter(item=>item.count===max);
  if (top.length===1) return `Respons terbanyak pada filter ini adalah “${top[0].type}” (${max} dari ${total} lead).`;
  if (top.length*max===total) return `Sebanyak ${total} lead tersebar merata di ${top.length} jenis respons. Masing-masing jenis muncul ${max} kali, sehingga belum ada respons yang dominan.`;
  return `Frekuensi tertinggi terbagi di ${top.length} jenis respons: ${top.map(item=>item.type).join(", ")}. Masing-masing muncul pada ${max} dari ${total} lead.`;
}
function conversationSummary(records,measured) {
  const minutes=measured.length?median(measured.map(lead=>lead.minutes)):null;
  const timing=minutes===null
    ? "Belum ada jeda balasan yang bisa diukur dari pesan CS."
    : `Dari ${measured.length} lead dengan jeda terukur, median balasannya ${num(minutes,minutes%1?1:0)} menit setelah pesan CS.`;
  const negative=records.filter(lead=>lead.mood==="Negatif").length;
  return timing+(negative?` Ada ${negative} lead dengan sentimen negatif. Buka detail percakapan untuk melihat alasan di balik respons mereka.`:"");
}
function velocity() {
  const records=visibleLeads();
  const recent=records.filter(l=>l.minutes!==null).sort((a,b)=>a.minutes-b.minutes);
  if (!records.length) return empty("Belum ada sampel WhatsApp","Pilih campaign dengan percakapan untuk melihat waktu balasan.");
  const middle=Math.floor(recent.length/2);
  const median=recent.length?(recent.length%2?recent[middle].minutes:(recent[middle-1].minutes+recent[middle].minutes)/2):null;
  return panel("Jeda balasan lead","Pesan pengiklan atau CS sampai lead membalas",`<div class="panel-body"><div class="detail-metrics"><div><span>Median balasan lead</span><strong>${recent.length?num(median,median%1?1:0)+" menit":"—"}</strong></div><div><span>Sampel dengan jeda terukur</span><strong>${recent.length} dari ${records.length}</strong></div></div></div>`
    +table(["Lead","Jeda CS → lead","Sentimen","Jenis respons"],recent.map(l=>`<tr><th scope="row"><button class="row-link" data-lead="${l.id}">${l.alias}</button></th><td>${l.minutes} menit</td><td>${l.mood}</td><td>${l.type}</td></tr>`).join("")))
    +panel("Cakupan pengukuran","",`<div class="panel-body">${info("Interval tersedia ketika pesan CS dan jawaban lead tercatat. Ambang diam dan definisi umur lead produksi masih dibahas.")}</div>`);
}

      <div class="ca-plot" role="slider" tabindex="0" aria-label="Hari dalam grafik ${metric.label}" aria-valuemin="1" aria-valuemax="${current.length}" aria-valuenow="${defaultIndex+1}" aria-valuetext="${safe(accessible(current[defaultIndex],defaultIndex))}">

function updateCreativeChartPoint(plot,index) {
  const markers=[...plot.querySelectorAll(".ca-chart-point")];
  const next=Math.max(0,Math.min(markers.length-1,index));
  const current=Number(plot.getAttribute("aria-valuenow"))-1;
  if (next===current) return;
  markers[current].classList.remove("is-current");
  markers[next].classList.add("is-current");
  plot.setAttribute("aria-valuenow",String(next+1));
  plot.setAttribute("aria-valuetext",markers[next].dataset.pointLabel);
}

function median(values) {
  const sorted=values.slice().sort((a,b)=>a-b), middle=Math.floor(sorted.length/2);
  return sorted.length%2?sorted[middle]:(sorted[middle-1]+sorted[middle])/2;
}

function analyzePattern(list) {
  const comparable=campaigns.map(c=>list.filter(x=>x.campaign===c.id&&x.days>=7&&x.results>=15)).sort((a,b)=>b.length-a.length)[0];
  const cohort = comparable || [];
  const hook="Bukti produksi";
  const yes=cohort.filter(c=>c.hook===hook), no=cohort.filter(c=>c.hook!==hook);
  const supported=cohort.length>=8&&yes.length>=3&&no.length>=3;
  const unitCost=c=>ratio(c.spend,c.results);
  const baseline=cohort.length?median(cohort.map(unitCost)):0;
  const consistent=ratio(yes.filter(c=>unitCost(c)<baseline).length,yes.length)>=2/3;
  const clear=supported&&consistent&&median(yes.map(unitCost))<median(no.map(unitCost));
  return {cohort,yes,no,supported,clear,unitCost};
}
function comparePage() {
  const tabs=tabRow([["obs","Perbandingan observasional"],["ab","Uji A/B Meta"]],state.compareType,"compare-type");
  if (state.compareType==="ab") return tabs+panel("Uji A/B Meta","Hasil studi yang dijalankan di Meta Ads Manager",empty("Belum ada uji A/B Meta","Hasil eksperimen akan muncul di sini setelah tersedia dari sumber Meta."));
  const visible=visibleCreatives();
  const selected=visible.filter(c=>state.selection.has(c.id)&&creativeAnalysis(c).status!=="Belum cukup data");
  const order=(a,b)=>state.compareSort==="name"?a.name.localeCompare(b.name,"id"):b.p[Number(state.compareSort)]-a.p[Number(state.compareSort)];
  const picker=`<details class="disclosure picker"><summary>Pilih kreatif <span>${selected.length} dipilih</span></summary><div class="picker-grid">${visible.map(c=>{const denied=creativeAnalysis(c).status==="Belum cukup data";return `<label class="pick ${denied?"disabled":""}"><input type="checkbox" data-pick="${c.id}" ${state.selection.has(c.id)?"checked":""} ${denied?"disabled":""}><span><strong>${c.name}</strong><small>${denied?"Belum cukup data":campaignName(c.campaign)}</small></span></label>`;}).join("")}</div></details>`;
  const objectives=[["wa","Percakapan WhatsApp"],["web","Penjualan website"]];
  const groups=Object.fromEntries(objectives.map(([channel])=>[channel,selected.filter(c=>campaigns.find(source=>source.id===c.campaign).channel===channel)]));
  const list=groups[state.compareObjective].sort(order);
  const objectiveTabs=tabRow(objectives.map(([channel,label])=>[channel,`${label} (${groups[channel].length})`]),state.compareObjective,"compare-objective","Tujuan campaign");
  const controls=`<div class="table-controls"><label class="select-control"><span class="sr">Urutkan dimensi</span><select id="compare-sort"><option value="name">Urutkan: Nama kreatif</option>${dimensions.map((d,i)=>`<option value="${i}" ${state.compareSort===String(i)?"selected":""}>${d.name}</option>`).join("")}</select>${icon("chevron-down")}</label><label class="toggle"><input id="compare-compact" type="checkbox" ${state.compact?"checked":""}> Tampilan ringkas</label></div>`;
  const rows=list.map(c=>`<tr><th scope="row">${creativeButton(c)}</th>${creativeAnalysis(c).dim.map(d=>`<td>${chip(d.label,statusClass(d.label))}${state.compact||d.certainty==="Belum cukup data"?"":`<small>${d.certainty} · ${d.baseline?"baseline akun":d.percentile+" persentil"}</small>`}</td>`).join("")}<td>${state.compact?pct(ratio(c.message[0],c.message[1])):messageMeasures(c)}</td><td>${creativeExplanationButton(c,"compare")}</td></tr>`);
  const matrix=list.length
    ? controls+`<div class="matrix">${table(["Kreatif",...dimensions.map(d=>d.name),"Ketersampaian pesan","Rincian penilaian"],rows.join(""))}</div>`+(list.length===1?'<p class="matrix-note">Pilih satu kreatif lagi dengan tujuan ini untuk membandingkan hasil.</p>':`<div class="panel-body matrix-note">${explanation("Status tiap dimensi tetap mengikuti peringkat akun. Efisiensi biaya dan kualitas hasil dibaca di dalam tujuan yang sama.")}</div>`)
    : empty("Belum ada kreatif yang dipilih","Pilih kreatif dengan tujuan ini atau ubah filter campaign.");
  const page=tabs+panel("Pilihan kreatif","Mulai dari kreatif dengan tujuan, penempatan, dan periode sebanding.",picker)+panel("Matriks perbandingan","Hasil observasional · indikatif",`<div class="objective-tabs">${objectiveTabs}</div>${matrix}`);
  if (list.length<2) return page;
  const pattern=analyzePattern(list);
  return page+
    split(panel("Belum ada pemenang yang jelas","",`<div class="panel-body">${explanation("Contoh ini menampilkan urutan per dimensi. Pemenang memerlukan selisih yang tetap jelas setelah koreksi perbandingan ganda.")}</div>`),panel("Pembeda & hipotesis uji",pattern.clear?"Asosiasi indikatif · keyakinan sedang":"Deskriptif, tanpa uji statistik",`<div class="panel-body"><p>${[...new Set(list.map(c=>c.hook))].join(" · ")}</p>${explanation(pattern.clear?"Median biaya chat pada kelompok hook bukti produksi adalah "+money(median(pattern.yes.map(pattern.unitCost)))+" dari "+pattern.yes.length+" kreatif, dibanding "+money(median(pattern.no.map(pattern.unitCost)))+" dari "+pattern.no.length+" kreatif dengan hook lain. Uji dua hook dengan format dan penempatan yang sama.":"Jenis hook pada pilihan ini dapat menjadi bahan uji. Pilih dua variasi dengan tujuan dan penempatan yang sama, lalu ukur biaya serta kualitas hasil di Ads Manager.")}</div>`));
}

function openCreativeExplanation(id,context) {

      : `Kreatif mengumpulkan ${creative.leads} lead matang. Dibutuhkan minimal ${quality.min} untuk menilai proporsi Hot. Biaya per percakapan tercatat ${cost} dan kreatif memuat ${completeness}.`;

function stageExplanation(channel, stage) {
  const {index,count,previousCount,rate,baseline,change}=stage;
  let observation;
  if (index===0) {
    observation=`Periode ini mencatat ${num(count)} tayangan, dibanding ${num(previousCount)} pada periode sebelumnya.`;
  } else if (change===null) {
    observation="Rasio belum bisa dibandingkan karena jumlah pada tahap sebelumnya nol di salah satu periode.";
  } else {
    const previousStage=stageNames[channel][index-1];
    const comparison=formatPointChange(change).toLowerCase().replace(" poin"," poin persentase");
    observation=comparison==="stabil"
      ? `Konversi dari ${previousStage} stabil di ${formatStageRate(rate,true)}.`
      : `Konversi dari ${previousStage} ${comparison}, dari ${formatStageRate(baseline,true)} menjadi ${formatStageRate(rate,true)}.`;
  }
  return `<section class="insight-next stage-explanation" aria-labelledby="stage-explanation-title">
    <header><h3 id="stage-explanation-title">${icon("sparkles")} Penjelasan AI</h3>${chip("Simulasi")}</header>
    <p>${safe(observation)}</p>
    <p><strong>Yang perlu dicek</strong>${safe(stageChecks[channel][index])}</p>
  </section>`;
}

  if (index) facts.push(
    ["Bagian dari tayangan",formatStageRate(stage.share,true)],
    ["Konversi dari "+names[index-1],formatStageRate(stage.rate,true)],
    ["Konversi periode lalu",formatStageRate(stage.baseline,true)],
    ["Perubahan konversi",stage.change===null?"Tanpa pembanding":formatPointChange(stage.change).replace(" poin"," poin persentase")]
  );
  showDialog(names[index],`<h3>Bukti tahap</h3>${definitionList(facts)}
    ${showHistory?`<div class="leak-history-detail">${leakHistoryChart(leakHistory(channelScope(channel)),index)}</div>`:""}
    ${stageExplanation(channel,stage)}
    ${info(channel==="web"?"Event website ditampilkan sebagai hitungan agregat.":index===5?"Closing merupakan indikasi dari chat.":index>2?"Tahap temperatur menggunakan pencapaian pertama dari chat.":"Metrik sumber berasal dari Meta Ads pada simulasi.")}`,channelName(channel));
}
function downloadCsv(rows,filename) {
  const csv=rows.map(row=>row.join(",")).join("\r\n");
  const url=URL.createObjectURL(new Blob(["\ufeff",csv],{type:"text/csv;charset=utf-8"}));
  const a=document.createElement("a");
  a.href=url;
  a.download=filename;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast("CSV diunduh.");
}

function exportReport() {
  const rows=[["Campaign","Jalur","Belanja IDR","Tayangan","Klik link","Jenis hasil","Jumlah hasil"],...scope().map(c=>{const [spend,impressions,clicks,chats,,,purchase]=stageTotals(c,state.days);return [c.name,channelName(c.channel),spend,impressions,clicks,c.channel==="wa"?"Percakapan dimulai":"Pembelian",c.channel==="wa"?chats:purchase];})];
  downloadCsv(rows,"FunnelLens-"+state.days+"hari.csv");
}

const actions = {
  menu:()=>setDrawer(!state.menu),
  alerts:()=>routeTo("peringatan"),
  profile:()=>routeTo("pengaturan"),
  search:openSearch,
  "use-demo":()=>{state.account="demo";state.campaign="all";render();},
  close:()=>$("#dialog").close(),
  about:()=>showDialog("Tentang FunnelLens",`<p>Prototipe menggunakan metrik, prospek, dan narasi simulasi. Tanggal snapshot adalah 19 November 2026.</p><p>Temuan dipakai untuk meninjau sumber iklan, aktivitas halaman, dan percakapan. Perubahan iklan dilakukan pengguna di Ads Manager.</p>`),
  "reset-filter":()=>{state.campaign="all";render();},
  download:exportReport,
  "download-creative-trend":exportCreativeTrend,
};

document.addEventListener("click",event=>{
  const navLink=event.target.closest("#sidebar a[href]");
  if (state.menu && navLink && navLink.hash===location.hash) {
    setDrawer(false);
    $("#main").focus();
    return;
  }
  const btn=event.target.closest("button");
  if (!btn) return;
  const d=btn.dataset;
  if (d.action) { actions[d.action]?.(); return; }
  if (d.insight) { openInsight(d.insight); return; }
  if (d.previewLead) { openPipelinePreview(d.previewLead); return; }
  if (d.lead) { openLead(d.lead); return; }
  if (d.leadSort) {
    const defaultDirection=["temperature","response"].includes(d.leadSort)?-1:1;
    state.leadSortDirection=state.leadSort===d.leadSort?-state.leadSortDirection:defaultDirection;
    state.leadSort=d.leadSort;
    state.leadPage=1;
    refreshLeadResults();
    $(`[data-lead-sort="${d.leadSort}"]`)?.focus({preventScroll:true});
    return;
  }
  if (d.leadPage) {
    state.leadPage=Number(d.leadPage);
    refreshLeadResults();
    $(".lead-pagination [aria-current=page]")?.focus({preventScroll:true});
    return;
  }
  if (d.creativeScroll) {
    const gallery=$("#creative-gallery");
    const card=gallery.firstElementChild;
    const step=card.getBoundingClientRect().width+parseFloat(getComputedStyle(gallery).columnGap);
    const behavior=window.matchMedia("(prefers-reduced-motion: reduce)").matches?"instant":"smooth";
    gallery.scrollBy({left:Number(d.creativeScroll)*step,behavior});
    return;
  }
  if (d.creativeCampaign) {
    $("#campaign").value=d.creativeCampaign;
    $("#campaign").dispatchEvent(new Event("change",{bubbles:true}));
    $("#campaign").focus();
    return;
  }
  if (d.creative) { openCreative(d.creative); return; }
  if (d.explainCreative) { openCreativeExplanation(d.explainCreative,d.context); return; }
  if (d.fatigue) { openCreative(d.fatigue,true); return; }
  if (d.stage!==undefined) { openStage(Number(d.stage),Object.hasOwn(d,"stageHistory")); return; }
  if (d.searchRoute) { $("#dialog").close(); routeTo(d.searchRoute); return; }
  if (d.focusQuote) { $("#quote-"+d.focusQuote)?.focus(); return; }
  if (d.insightOpen) {
    const i=getInsights().find(x=>x.id===d.insightOpen);
    if (!i) return;
    if (i.target) { openLead(i.target); return; }
    if (i.creativeId) { openCreative(i.creativeId,true); return; }
    if (i.id==="website") state.channel="web";
    if (i.id==="leak") state.channel="wa";
    $("#dialog").close(); routeTo(i.route); return;
  }
  if (d.review) {
    const i=getInsights().find(x=>x.id===d.review);
    if (!i) return;
    const next=reviewStatus(i)==="done"?"read":"done";
    storeHistory(i,next);
    $("#dialog").close(); render();
    toast(next==="done"?"Temuan ditandai ditindaklanjuti.":"Temuan kembali ke daftar tinjauan.");
    return;
  }
  const tabs={channel:"channel",creativeChannel:"creativeChannel",creativeMetric:"creativeMetric",leadLevel:"leadLevel",compareType:"compareType",compareObjective:"compareObjective",alertTab:"alertTab"};
  for (const [attribute,key] of Object.entries(tabs)) {
    if (d[attribute]) {
      state[key]=d[attribute];
      if (key==="leadLevel") state.leadPage=1;
      if (key==="creativeChannel" && !creativeDashboardScope().length) state.campaign="all";
      render();
      const dataAttr=attribute.replace(/[A-Z]/g,L=>"-"+L.toLowerCase());
      document.querySelector(`[data-${dataAttr}="${d[attribute]}"]`)?.focus({preventScroll:true});
      return;
    }
  }
});
document.addEventListener("change",event=>{
  const el=event.target;
  if (el.id==="lead-page-size") {
    state.leadPageSize=Number(el.value);
    state.leadPage=1;
    refreshLeadResults();
    return;
  }
  if (["account","campaign","period"].includes(el.id)) state.leadPage=1;
  if (el.id==="account") {
    state.account=el.value;
    state.campaign="all";
  } else if (el.id==="campaign") {
    state.campaign=el.value;
    const matching=campaigns.find(c=>c.id===el.value);
    if (matching) {
      state.channel=matching.channel;
      state.compareObjective=matching.channel;
      if (state.route==="kreatif" && state.creativeChannel!=="all") state.creativeChannel=matching.channel;
    }
  } else if (el.id==="period") state.days=Number(el.value);
  else if (el.id==="compare-sort") state.compareSort=el.value;
  else if (el.id==="compare-compact") state.compact=el.checked;
  else if (el.dataset.pick) {
    if (el.checked) state.selection.add(el.dataset.pick);
    else state.selection.delete(el.dataset.pick);
    if (state.selection.size>=5) state.compact=true;
  } else return;
  render();
  if (el.dataset.pick) document.querySelector(`[data-pick="${el.dataset.pick}"]`)?.focus();
});
document.addEventListener("input",event=>{
  if (event.target.id==="global-search") { state.search=event.target.value; $("#search-results").innerHTML=searchResults(); return; }
  if (event.target.id==="pipeline-search") {
    state.pipelineSearch=event.target.value;
    $("#pipeline-results").innerHTML=pipelineCards();
    return;
  }
  if (event.target.id!=="lead-search") return;
  state.leadSearch=event.target.value;
  state.leadPage=1;
  refreshLeadResults();
});
function pointFromPointer(event) {
  const plot=event.target.closest(".ca-plot");
  if (!plot) return;
  const box=plot.getBoundingClientRect();
  const position=(event.clientX-box.left)/box.width;
  updateCreativeChartPoint(plot,Math.round(position*(Number(plot.getAttribute("aria-valuemax"))-1)));
}

document.addEventListener("pointermove",pointFromPointer);
document.addEventListener("pointerdown",pointFromPointer);
document.addEventListener("pointerout",event=>{
  const step=event.target.closest(".leak-step.hide-leak-history");
  if (step && !step.contains(event.relatedTarget) && !step.matches(":focus-visible")) step.classList.remove("hide-leak-history");
});
document.addEventListener("focusout",event=>{
  if (event.target.matches(".leak-step.hide-leak-history:not(:hover)")) event.target.classList.remove("hide-leak-history");
});
document.addEventListener("scroll",event=>{
  if (event.target.id==="creative-gallery") syncCreativeGallery();
},true);
window.addEventListener("resize",syncCreativeGallery);
document.addEventListener("keydown",event=>{
  if (event.key==="Escape" && !$("#dialog").open) {
    document.querySelectorAll(".leak-step:is(:hover,:focus-visible)").forEach(step=>step.classList.add("hide-leak-history"));
  }
  if (event.target.classList?.contains("ca-plot")) {
    const current=Number(event.target.getAttribute("aria-valuenow"))-1;
    const offsets={ArrowLeft:current-1,ArrowDown:current-1,ArrowRight:current+1,ArrowUp:current+1,
      Home:0,End:Number(event.target.getAttribute("aria-valuemax"))-1};
    if (Object.hasOwn(offsets,event.key)) {
      event.preventDefault();
      updateCreativeChartPoint(event.target,offsets[event.key]);
      return;
    }
  }
  if ((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==="k") {
    event.preventDefault();
    if (state.menu) setDrawer(false);
    openSearch();
    return;
  }
  if (!state.menu || $("#dialog").open) return;
  if (event.key==="Escape") { event.preventDefault(); setDrawer(false); return; }
  if (event.key!=="Tab") return;
  const items=[...$("#sidebar").querySelectorAll("a[href],button,summary")].filter(el=>el.getClientRects().length);
  const first=items[0], last=items.at(-1);
  if (event.shiftKey && document.activeElement===first) { event.preventDefault(); last.focus(); }
  else if (!event.shiftKey && document.activeElement===last) { event.preventDefault(); first.focus(); }
});
$("#dialog").addEventListener("close",()=>{
  if (returnFocus?.isConnected) returnFocus.focus();
  else $("#main").focus({preventScroll:true});
});
window.addEventListener("hashchange",readRoute);
readRoute();

</script>
