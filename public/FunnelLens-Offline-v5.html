:root{
  color-scheme:light;--canvas:#f5f7fb;--paper:#fff;--ink:#14213a;--body:#33445e;--muted:#56667e;--subtle:#6c7b92;
  --border:#e0e6ef;--nav:#101b30;--nav-border:#293850;--nav-soft:#192840;--nav-ink:#c9d3e3;--brand:#255ccb;
  --green:#12654f;--orange:#a13925;--amber:#825604;--indigo:#5938a5;--blue:#1c54b1;
  --radius:15px;--shadow:0 2px 4px #172f5205,0 5px 15px #172f5205;
  font-family:Jakarta,system-ui,sans-serif;font-size:16px;line-height:1.5;color:var(--ink);background:var(--canvas);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit}
button,a,select,input,summary{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
button:disabled{cursor:default}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid #457cf2;outline-offset:3px}
.skip{position:fixed;z-index:9;top:10px;left:12px;padding:10px 14px;background:var(--paper);border-radius:8px;transform:translateY(-150%)}
.skip:focus{transform:none}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.icon{width:16px;height:16px;stroke-width:1.5;vertical-align:middle;flex:none}
.layout{display:grid;grid-template-columns:246px minmax(0,1fr);min-height:100vh}
.sidebar{height:100dvh;position:sticky;top:0;display:flex;flex-direction:column;background:var(--nav);color:var(--nav-ink);padding:26px 17px 16px;overflow:auto}
.brand{display:flex;align-items:center;gap:11px;margin:1px 8px 30px;color:white;font-size:1.26rem;font-weight:600;letter-spacing:-.062em;width:max-content}
.brand-icon{width:35px;height:35px;border-radius:10px;background:#3975ec;color:white;box-shadow:inset 0 0 0 1px #ffffff30;display:grid;place-items:center}
.brand-icon svg{width:27px}
.brand-dot{color:#78aafc;margin-left:-9px}
.workspace-id,.sidebar-bottom{display:flex;align-items:center;gap:11px}
.workspace-id{border:1px solid var(--nav-border);background:#18263d;border-radius:11px;padding:10px;margin:0 2px 30px}
.workspace-avatar,.user-avatar,.top-avatar{display:grid;place-items:center;flex:none;font-weight:600;border-radius:9px}
.workspace-avatar{width:34px;height:34px;background:#263c60;color:#c6dcff;font-size:.92rem}
.workspace-id strong,.sidebar-bottom strong{font-size:.84rem;color:#f2f6ff;display:block}
.workspace-id small,.sidebar-bottom small{font-size:.72rem;display:block;color:#9eacc3;margin-top:1px}
.nav-caption{display:block;padding:0 12px;margin:0 0 8px;font-size:.66rem;font-weight:600;letter-spacing:.13em;color:#9baaca}
.nav-caption.separate{margin-top:25px}
.nav-link{display:flex;align-items:center;gap:10px;min-height:43px;padding:8px 11px;border-radius:8px;font-size:.83rem;font-weight:600;border:1px solid transparent;margin:3px 0}
.nav-link:hover{background:#202f47;color:#fff}
.nav-link.selected{background:#224575;border-color:#355786;color:#f3f7ff}
.nav-link.selected .icon{color:#aacbff}
.nav-count{margin-left:auto;border-radius:5px;padding:0 6px;background:#304360;color:#e4eeff;font-size:.71rem}
.sidebar-bottom{margin-top:auto;padding:17px 3px 0;border-top:1px solid var(--nav-border);min-height:57px}
.sidebar nav{padding-bottom:24px}
.user-avatar{width:35px;height:35px;background:#274260;color:#d9e5ff;font-size:.78rem;border-radius:50%}
.sidebar-help{margin-left:auto;color:#b8c5db!important}
.workspace{min-width:0;display:flex;flex-direction:column}
.topbar{height:65px;background:var(--paper);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:20px}
.top-left,.top-right{display:flex;align-items:center;gap:12px}
.account-meta{display:grid;place-items:center;width:34px;height:34px;background:#eaf1ff;color:var(--blue);border:1px solid #dbe8ff;border-radius:9px;font-family:Plex,sans-serif;font-size:1.5rem;font-weight:600;line-height:1}
.top-label strong,.top-label small{display:block}
.top-label strong{font-size:.85rem;font-weight:600}
.top-label small{font-size:.73rem;color:var(--muted)}
.demo-badge{display:inline-flex;align-items:center;gap:7px;font-size:.76rem;font-weight:600;background:#f1f5fa;color:#495b76;border:1px solid var(--border);border-radius:20px;padding:5px 10px;white-space:nowrap}
.demo-badge i,.source i,.alert-button i{width:7px;height:7px;border-radius:50%;background:#5184e0;flex:none}
.top-avatar{width:35px;height:35px;border:1px solid #d9e6fa;background:#eaf2ff;color:#24549c;font-size:.74rem;border-radius:50%}
.icon-button{display:inline-grid;place-items:center;min-width:38px;min-height:38px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--muted);position:relative}
.icon-button:hover,.top-avatar:hover{background:#e9f1fe;color:#174b9e}
.alert-button i{background:#336ee1;position:absolute;right:8px;top:7px;box-shadow:0 0 0 2px white}
.mobile-menu,.scrim{display:none}
main{width:100%;max-width:1550px;margin:0 auto;padding:33px 32px 27px;flex:1}
main:focus{outline:none}
.page-heading{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:24px}
.page-heading h1{font-size:clamp(1.9rem,3vw,2.7rem);line-height:1.13;letter-spacing:-.066em;font-weight:600}
.page-heading p{color:var(--muted);margin-top:8px;font-size:.96rem}
.breadcrumb{display:flex;align-items:center;gap:7px;font-size:.78rem;color:var(--blue);font-weight:600;margin-bottom:9px}
.breadcrumb .icon{width:16px;height:16px}
.global-filters{display:flex;align-items:center;gap:9px;flex:none}
.select-control,.button,.input-control{min-height:42px;display:inline-flex;align-items:center;gap:8px;padding:0 12px;border:1px solid #d8e2ef;border-radius:9px;background:var(--paper);color:var(--body);font-size:.83rem;font-weight:600;white-space:nowrap}
.select-control{position:relative;padding-right:30px}
.select-control select{appearance:none;min-height:40px;min-width:0;border:0;color:inherit;background:transparent;font-size:inherit;font-weight:inherit;cursor:pointer;width:100%;max-width:177px}
.select-control>.icon:last-child{position:absolute;right:10px;pointer-events:none;width:14px}
.select-control .icon,.button .icon,.input-control .icon{width:16px;height:16px}
.select-control:focus-within,.input-control:focus-within{border-color:#5283e8}
.select-control select:focus-visible,.input-control input:focus-visible{outline:none}
.date-control{background:#edf4ff;color:#1f54ad;border-color:#cdddf6}
.button:hover{border-color:#92b3ec;color:#164eaa;background:#f4f8ff}
.button.primary{background:var(--brand);border-color:var(--brand);color:white}
.button.primary:hover{background:#194cab}
.static-date{font-size:.79rem;color:var(--muted)}
.text-button{padding:0;border:0;background:none;display:inline-flex;align-items:center;gap:5px;color:var(--blue);font-size:.84rem;font-weight:600;text-align:left}
.text-button:hover,.row-link:hover{text-decoration:underline;text-underline-offset:3px}
.text-button .icon{width:16px;height:16px}
.source-strip{display:flex;align-items:center;gap:20px;min-height:52px;padding:8px 14px;background:#fff;border:1px solid var(--border);border-radius:11px;margin-bottom:18px;font-size:.8rem;box-shadow:var(--shadow)}
.source-title{display:flex;align-items:center;gap:8px;border-right:1px solid var(--border);padding-right:17px;white-space:nowrap}
.source-title .icon{width:17px;color:var(--blue)}
.source-list{display:flex;flex-wrap:wrap;gap:8px 17px}
.source{display:flex;align-items:center;gap:7px;color:var(--body);font-weight:600;white-space:nowrap}
.source i{background:#259577;box-shadow:0 0 0 3px #e6f6f0;width:6px;height:6px}
.source-cta{display:flex;align-items:center;gap:7px;margin-left:auto;color:var(--muted);font-size:.76rem;white-space:nowrap}
.source-cta:hover{color:var(--blue)}
.source-cta .icon{width:15px;height:15px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}
.kpi,.insight-card,.panel,.empty{background:var(--paper);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.kpi{padding:15px 15px 14px;min-width:0}
.kpi-top{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.glyph{display:inline-grid;place-items:center;width:33px;height:33px;border-radius:9px;flex:none}
.glyph .icon{width:17px;height:17px}
.glyph.blue,.glyph.sky{background:#e7f0ff;color:#205ac7}
.glyph.violet{background:#e0f0f4;color:#246773}
.glyph.mint{background:#e2f6ee;color:#18755c}
.glyph.peach{background:#ffede4;color:#ae4b25}
.kpi-label{color:var(--muted);font-size:.8rem;font-weight:600}
.kpi>strong{display:block;font-family:Plex,system-ui,sans-serif;font-size:clamp(1.65rem,2.65vw,2.26rem);line-height:1.05;letter-spacing:-.052em;font-weight:600;font-variant-numeric:tabular-nums;margin-bottom:12px}
.kpi-foot{display:flex;align-items:center;gap:7px;color:var(--subtle);font-size:.7rem;min-height:22px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:22px;padding:3px 8px;border-radius:100px;font-size:.7rem;font-weight:600;line-height:1.2;white-space:nowrap;background:#eef2f7;color:#455770;vertical-align:middle}
.chip .icon{width:12px;height:12px;stroke-width:2}
.chip.green{background:#e4f5ee;color:var(--green)}
.chip.orange{background:#fce9e2;color:var(--orange)}
.chip.amber{background:#fff0d6;color:var(--amber)}
.chip.blue{background:#e8f1ff;color:var(--blue)}
.chip.indigo{background:#deedfc;color:var(--indigo)}
.overview-insights{margin-top:29px}
.section-heading{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px}
.section-title{display:flex;align-items:center;gap:11px}
.section-icon{width:37px;height:37px;border-radius:10px;display:grid;place-items:center;color:var(--blue);background:#e5efff;border:1px solid #d8e6ff;flex:none}
.section-heading h2{font-size:1.32rem;letter-spacing:-.047em;line-height:1.25}
.section-heading p{font-size:.79rem;color:var(--muted);margin-top:3px}
.insight-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
.insight-card{overflow:hidden;display:flex;flex-direction:column}
.visual-label{position:relative;display:flex;align-items:center;gap:6px;text-align:left;font-size:.72rem;font-weight:600;padding-left:2px}
.visual-label .icon{width:14px;height:14px}
.insight-body{padding:14px 15px 15px;display:flex;flex-direction:column;align-items:flex-start;flex:1}
.insight-tags{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.insight-body h3{font-size:1.02rem;line-height:1.36;letter-spacing:-.034em;margin:9px 0 6px}
.insight-body p{font-size:.82rem;color:var(--muted);line-height:1.54;margin-bottom:13px}
.insight-body .text-button{margin-top:auto;min-height:29px}
.site-footer{display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--border);color:var(--subtle);font-size:.73rem;padding:13px 32px}
.site-footer span:first-child{font-weight:600;color:var(--muted)}

.page-tabs{display:flex;align-items:center;gap:23px;border-bottom:1px solid var(--border);margin:-1px 0 20px;overflow:auto}
.page-tabs a{padding:10px 2px 12px;border-bottom:2px solid transparent;white-space:nowrap;font-size:.81rem;font-weight:600;color:var(--muted)}
.page-tabs a:hover,.page-tabs a[aria-current]{color:var(--blue)}
.page-tabs a[aria-current]{border-color:var(--brand)}
.page-content,.stack{display:grid;gap:16px}
.panel{min-width:0;overflow:clip}
.panel-heading{padding:18px 19px 13px}
.panel-heading h2{font-size:1.15rem;letter-spacing:-.044em;line-height:1.3}
.panel-heading p{font-size:.83rem;color:var(--muted);margin-top:4px}
.panel-body{padding:0 19px 18px}
.panel-body>p{margin-bottom:12px;color:var(--body)}
.panel-body>.explain:not(:first-child){margin-top:14px}
.split{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;align-items:start;min-width:0}
.tabs{display:flex;gap:4px;width:max-content;max-width:100%;overflow:auto;padding:4px;background:#eaf0f8;border:1px solid var(--border);border-radius:10px}
.tabs button{border:0;background:none;border-radius:7px;color:var(--body);font-size:.8rem;font-weight:600;padding:6px 11px;min-height:32px;white-space:nowrap}
.tabs button[aria-pressed=true]{background:white;color:var(--blue);box-shadow:0 0 0 1px var(--border)}
.button-row{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
.inline-info,.explain{border-radius:var(--control-radius);padding:12px;font-size:.875rem;color:var(--body);background:var(--surface);border:1px solid var(--border);line-height:1.55}
.inline-info{display:flex;align-items:flex-start;gap:8px}
.inline-info .icon{width:17px;height:17px;color:var(--blue);margin-top:2px}
.explain{margin:9px 0 12px}
.explain>span{display:flex;align-items:center;gap:6px;color:var(--ink);font-weight:600;font-size:.8125rem;margin-bottom:4px}
.explain>span .icon{width:14px;height:14px;color:var(--brand)}
.empty{padding:27px 18px;text-align:center;grid-column:1/-1}
.panel .empty{border:0;box-shadow:none}
.empty h3{margin:8px 0 5px;font-size:1rem}
.empty p{color:var(--muted);font-size:.85rem}
.empty .button{margin-top:12px}
.empty-icon{display:inline-grid;place-items:center;width:39px;height:39px;border-radius:10px;background:#ebf2ff;color:var(--blue)}

.stages{padding:0 16px 16px;display:grid}
.stage{display:grid;grid-template-columns:minmax(0,1fr) auto 16px;gap:4px 8px;align-items:center;text-align:left;background:var(--paper);color:var(--ink);border:0;border-bottom:1px solid var(--border);padding:12px 8px;min-height:56px}
.stage:last-child{border-bottom:0}
.stage:hover{background:var(--hover)}
.stage:focus-visible{outline-offset:-2px}
.stage-name{font-weight:600}
.stage strong{font:600 .9375rem Plex,sans-serif;text-align:right;font-variant-numeric:tabular-nums}
.stage-meta{grid-column:1/-1;color:var(--muted);font-size:.75rem}
.stage.leak-stage{background:#fff6ef;box-shadow:inset 2px 0 #af4c22}
.drawer-close{display:none}
@media(max-width:900px){
 .sidebar .drawer-close{display:grid;position:absolute;right:13px;top:15px;place-items:center;color:#eff6ff;background:var(--nav-soft);border:1px solid var(--nav-border);border-radius:7px;width:42px;height:42px}
 body.drawer-open{overflow:hidden}
}

.conversation-summary .explain{margin:0}
.response-summary{margin-top:14px}
.detail-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.detail-metrics>div{padding:8px 9px;border-radius:8px;background:#f5f7fc;display:grid;gap:3px}
.detail-metrics span{font-size:.74rem;color:var(--muted);font-weight:600}
.detail-metrics strong{font-size:1.3rem;font-family:Plex,sans-serif}
.movement-item{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;border-bottom:1px solid var(--border);padding:11px 3px;color:var(--body);text-align:left;font-size:.85rem}
.movement-item span:first-child{flex:1}
.movement-item:hover{color:var(--blue)}
.movement-item .icon{width:15px;height:15px}
.movement-item+.inline-info{margin-top:11px}
.table-controls{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:0 19px 13px}
.input-control input{border:0;background:none;color:var(--ink);min-width:0;width:170px;min-height:40px;font-size:.86rem}
.table-wrap{overflow:auto;border-top:1px solid var(--border)}
table{width:100%;border-collapse:separate;border-spacing:0;text-align:left;font-size:.82rem}
th,td{padding:11px 13px;border-bottom:1px solid var(--border);vertical-align:middle}
thead th{background:#e9f2fa;color:var(--body);font-size:.72rem;font-weight:600;white-space:nowrap}
tbody th{font-weight:600}
tbody tr:last-child th,tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#f8faff}
table small,.pick small{display:block;color:var(--muted);font-size:.72rem;font-weight:550;margin-top:3px}
.row-link{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:0;text-align:left;color:var(--blue);font-weight:600;line-height:1.35}
.creative-link{min-width:150px}
.creative-glyph{width:31px;height:31px}
.breakdown>div{display:grid;grid-template-columns:120px 1fr 18px;gap:10px;align-items:center;margin-bottom:8px;font-size:.81rem}
.meter{height:9px;background:#eaf0fb;border-radius:6px;overflow:hidden}
.meter i{display:block;background:#5686e6;width:var(--size);height:100%;border-radius:6px}
.disclosure{padding:0;margin-bottom:0}
.disclosure summary{display:list-item;padding:12px 19px;cursor:pointer;font-size:.85rem;font-weight:600;color:var(--body)}
.disclosure summary span{margin-left:8px;color:var(--muted);font-size:.76rem;font-weight:550}
.disclosure p{margin:4px 19px 12px;color:var(--muted);font-size:.82rem}
.picker summary{border-top:1px solid var(--border)}
.picker-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:8px;padding:0 19px 15px}
.pick{display:flex;align-items:start;gap:8px;border:1px solid var(--border);border-radius:8px;padding:8px 9px;font-size:.8rem}
.pick.disabled{background:#f5f7fb;color:var(--muted)}
input[type=checkbox]{accent-color:var(--brand)}
.toggle{font-size:.82rem;color:var(--body);display:flex;gap:6px;font-weight:600}
.matrix th:first-child{position:sticky;left:0;z-index:1;background:#fff;border-right:1px solid var(--border)}
.matrix thead th:first-child{background:#e9f2fa}
.objective-tabs{padding:0 19px 13px}
.row-explanation{min-height:32px;padding:4px 9px;font-size:.77rem;color:var(--blue)}
.matrix-note{padding-top:10px}
p.matrix-note{padding:9px 19px 14px;color:var(--muted);font-size:.85rem}
.measure{display:grid;gap:4px;padding:8px 0;border-bottom:1px solid var(--border)}
.measure:last-child{border-bottom:0}
.measure strong{font-size:.81rem;line-height:1.5}
.measure span:not(.chip){color:var(--muted);font-size:.79rem;line-height:1.4}
dialog{width:min(510px,100%);max-width:100%;height:100%;max-height:100%;margin:0 0 0 auto;padding:0;border:0;border-left:1px solid var(--border);color:var(--ink);background:white;box-shadow:-12px 0 52px #101b3030}
dialog::backdrop{background:#0d192b80}
.dialog-heading{position:sticky;top:0;z-index:2;background:white;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:start;gap:12px;padding:18px 20px}
.dialog-eyebrow{font-size:.75rem;color:var(--blue);font-weight:600}
.dialog-heading h2{font-size:1.45rem;letter-spacing:-.045em;line-height:1.25;margin-top:3px}
.dialog-heading p{font-size:.82rem;color:var(--muted);margin-top:5px}
.dialog-body{padding:16px 20px 26px}
.dialog-body h3{font-size:1rem;margin:14px 0 5px}
.dialog-body>p{color:var(--body);margin-top:8px;font-size:.9rem}
.insight-next{margin-top:16px;padding:13px 14px;border:1px solid var(--border);border-radius:var(--radius);background:#f8fafc}
.insight-next h3{margin:0 0 6px}
.insight-next p{color:var(--body);font-size:.925rem}
.insight-next .button-row{margin-top:12px}
.stage-explanation{margin:12px 0;background:var(--surface);border-inline-start:3px solid var(--brand)}
.stage-explanation header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.stage-explanation h3{display:flex;align-items:center;gap:8px;margin:0}
.stage-explanation h3 .icon{color:var(--brand)}
.stage-explanation p+p{margin-top:8px}
.stage-explanation p strong{display:block;color:var(--ink);font-size:.82rem}
.definitions{margin:4px 0 13px}
.definitions>div{display:grid;grid-template-columns:1fr 1.1fr;gap:11px;padding:8px 0;border-bottom:1px solid var(--border);font-size:.84rem}
.definitions dt{color:var(--muted)}
.definitions dd{margin:0;font-weight:600}
.lead-metrics{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px
}
.lead-metrics>div{
  display:block;padding:9px 11px;background:#f8fafc;border:1px solid var(--border);border-radius:7px;overflow-wrap:anywhere
}
.lead-metrics dd{margin-top:3px}
.conversation-trail{display:grid;margin-top:11px}
.message{max-width:90%;margin:0;background:#f0f4fb;border:1px solid var(--border);padding:9px 10px;border-radius:10px 10px 10px 1px}
.message.reply{justify-self:end;background:#eaf4ff;border-color:#d7e6fb;border-radius:10px 10px 1px 10px}

.message p{font-size:.85rem}
.message-gap{height:var(--gap);min-height:27px;display:flex;align-items:center;justify-content:center;gap:5px;color:var(--muted);font-size:.72rem}
.message-gap .icon{width:14px;height:14px}
.toast{position:fixed;z-index:3;bottom:16px;right:16px;display:flex;align-items:center;gap:8px;background:#14213a;color:white;border-radius:9px;padding:10px 13px;font-size:.85rem;box-shadow:0 5px 15px #14213a35}

/* Visual system carried across from the original FunnelLens interface. */
:root{
  --canvas:#f6f7f8;--paper:#fff;--ink:#172132;--body:#3c4756;--muted:#566170;--subtle:var(--muted);
  --surface:#f0f2f4;--control-radius:8px;--hover:#f3f6f8;--focus:#0369a1;
  --border:#dfe4e8;--nav:#111827;--nav-border:#2b3645;--nav-soft:#202b39;--nav-ink:#cbd5e1;
  --brand:#0369a1;--blue:#075985;--radius:10px;--shadow:none;
}
.layout{grid-template-columns:246px minmax(0,1fr)}
.sidebar{padding:24px 16px 16px}
.brand{gap:8px;letter-spacing:-.025em;margin:0 8px 24px;color:#f8fafc}
.brand-icon{background:transparent;color:#38bdf8;box-shadow:none;width:31px;height:34px}
.brand-icon svg{width:31px}
.brand-dot{color:#38bdf8;margin-left:-6px}
.workspace-id{gap:8px;padding:8px;margin:0 0 20px;background:var(--nav-soft);border-radius:var(--control-radius)}
.workspace-avatar{background:#2e3b51;color:#dceaf7;border-radius:7px}
.workspace-id strong{font-size:.875rem}
.workspace-id small{font-size:.75rem;color:#aab7cd}
.nav-caption{padding-left:10px;color:#a6b5ce;font-size:.75rem;letter-spacing:0}
.nav-caption.separate{margin:20px 0 8px}
.nav-link,.nav-group summary{min-height:40px;border-radius:var(--control-radius);font-size:.875rem;font-weight:600}
.nav-link.selected{background:var(--nav-soft);border-color:var(--nav-border);color:#fff}
.nav-link.selected .icon{color:#7dd3fc}
.nav-link:hover,.nav-group summary:hover,.nav-children a:hover{background:#202c3e;color:#fff}
.nav-divider{background:var(--nav-border);height:1px;margin:16px 0 12px}
.nav-group summary{list-style:none;display:flex;align-items:center;gap:10px;padding:7px 11px;cursor:pointer}
.nav-group summary::-webkit-details-marker{display:none}
.nav-caret{margin-left:auto;width:14px;height:14px}
.nav-group[open] .nav-caret{transform:rotate(180deg)}
.nav-group .icon:not(.nav-caret){width:18px;height:18px}
.nav-children{border-left:1px solid #34435a;margin:0 0 6px 20px;padding:0 0 0 8px}
.nav-children a{display:block;padding:7px 8px;border-radius:5px;font-size:.78rem;color:#b8c8dc}
.nav-children a[aria-current]{color:#fff;background:var(--nav-soft);box-shadow:inset 2px 0 #7dd3fc}
.sidebar-bottom{padding:8px 0 0}
.help-link{display:flex;align-items:center;gap:9px;border:0;background:transparent;color:var(--nav-ink);padding:8px 10px;font-size:.82rem;text-align:left;width:100%;border-radius:6px}
.help-link:hover{background:#202c3e;color:white}
.help-link .icon{width:17px;height:17px}
.topbar{height:64px;padding-inline:24px}
.account-switch{position:relative;display:flex;align-items:center;gap:9px;color:var(--ink);padding-right:18px}
.account-switch select{appearance:none;border:0;background:transparent;color:inherit;min-height:40px;font-size:.875rem;font-weight:600;cursor:pointer}
.account-switch>.icon{pointer-events:none;position:absolute;right:0;width:15px;height:15px;color:var(--muted)}
.account-meta{width:22px;height:30px;border:0;background:transparent;color:#0369a1;font-size:1.55rem}
.search-shortcut{min-height:39px;border:0;display:flex;align-items:center;gap:8px;background:none;border-radius:7px;color:var(--muted);font-size:.84rem;padding:5px 9px}
.search-shortcut:hover{background:#f1f5f9}
.search-shortcut kbd{font:600 .73rem Plex,sans-serif;border:1px solid var(--border);border-radius:4px;background:#fafbfd;padding:2px 5px;white-space:nowrap}
.top-avatar{color:#334155;background:#edf2f7;border-color:#e2e8f0}
.alert-button i{background:#b9402d}
main{padding:24px;max-width:1512px}
.page-heading{margin-bottom:20px;align-items:center}
.page-heading h1{font-size:clamp(1.5rem,2.4vw,2rem);letter-spacing:-.025em}
.page-heading p{font-size:.875rem;margin-top:4px}
.page-tabs{display:none}
.select-control,.button,.input-control{border-color:var(--border);border-radius:var(--control-radius);min-height:44px;font-size:.875rem}
.date-control{color:var(--body);background:var(--paper);border-color:var(--border)}
.date-control select option{color:var(--body);background:#fff}
.select-control:focus-within,.input-control:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.source-strip{min-height:48px;gap:16px;border-radius:var(--control-radius);margin-bottom:0;padding:8px 16px;font-size:.875rem}
.source-title{gap:4px;padding-right:16px}
.source-list{gap:8px 16px}
.source{font-size:.85rem}
.source i{background:#28765a;box-shadow:none}
.source-inactive{color:var(--muted);font-weight:540}
.source-inactive i{background:#8b99a9}
.source-cta{font-size:.8rem;color:var(--blue);text-decoration:underline;text-underline-offset:3px}
.kpi-grid{gap:0;border:1px solid var(--border);border-radius:var(--radius);background:var(--paper);overflow:hidden;padding:16px 0}

.insight-feature{grid-template-columns:minmax(0,1fr) minmax(240px,40%);gap:8px 24px;padding:20px}

.insight-feature .text-button{grid-column:1;grid-row:2;max-width:none;min-height:40px}

.conversion-cue{margin:0;min-width:0;border-radius:var(--control-radius);background:var(--surface);padding:12px 16px}
.insight-feature .conversion-cue{grid-column:2;grid-row:1/3}
.cue-caption{font-size:.8125rem;font-weight:600;color:var(--ink)}
.cue-line{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px 8px;margin-top:8px;font-size:.75rem;color:var(--muted)}
.cue-line strong{text-align:right;color:var(--ink);font-family:Plex,sans-serif;font-size:.875rem;font-variant-numeric:tabular-nums}
.cue-track{grid-column:1/-1;height:8px;border-radius:2px;background:#dbe2e7;overflow:hidden}
.cue-track i{width:var(--reach);height:100%;display:block;background:var(--brand);border-radius:2px}
.cue-line.previous .cue-track i{background:#647587}
.cue-scale{display:flex;justify-content:space-between;margin-top:4px;font: .6875rem Plex,sans-serif;color:var(--muted)}
.dialog-search{display:flex;width:100%;margin-bottom:10px}
.dialog-search input{width:100%}
.search-result{display:flex;gap:12px;justify-content:space-between;width:100%;min-height:38px;padding:8px;border:0;border-bottom:1px solid var(--border);background:none;color:var(--blue);text-align:left}
.search-result:hover{background:#f4f8fb}
.search-result small,.no-search{color:var(--muted)}
.panel-heading p,.empty p,.inline-info,.explain,.dialog-body>p,.measure span:not(.chip){font-size:.925rem}
.panel-heading h2{font-size:1.17rem}
.table-wrap table,.movement-item,.stage{font-size:.875rem}
thead th,.chip{font-size:.77rem}

.kpi>strong,.detail-metrics strong,td,.breakdown strong{font-variant-numeric:tabular-nums}

/* App-wide soft blue palette. */
:root{
  --ov-background:#e3edf7;
  --ov-tint:#eef5fc;
  --ov-card:#fbfdff;
  --ov-ink:#1a2a40;
  --ov-text:#40556d;
  --ov-muted:#536b83;
  --ov-line:#d1e0ef;
  --ov-accent:#2d65a6;
  --ov-accent-light:#deedfc;
  --ov-blue:#167887;
  --ov-prior:#acc8e3;
  --canvas:var(--ov-background);--paper:var(--ov-card);--ink:var(--ov-ink);
  --body:var(--ov-text);--muted:var(--ov-muted);--border:var(--ov-line);
  --surface:var(--ov-tint);--hover:#e6f1fb;--brand:var(--ov-accent);--blue:var(--ov-accent);
  --focus:var(--ov-accent);--indigo:#2a5b8e;
}
.layout{
  grid-template-columns:220px minmax(0,1fr);
  gap:16px;
  padding:16px;
  background:var(--ov-background);
  color:var(--ov-ink);
}
.layout .sidebar{
  --nav:var(--ov-tint);
  --nav-border:var(--ov-line);
  --nav-soft:#e0edf8;
  --nav-ink:var(--ov-text);
  height:calc(100dvh - 32px);
  top:16px;
  padding:18px 12px 12px;
  border:1px solid #fff;
  border-radius:14px;
}
.layout .brand{color:var(--ov-ink);margin-bottom:20px}
.layout .brand-icon,.layout .brand-dot{color:var(--ov-accent)}
.layout .workspace-id{background:#e5effa;border-color:#d2e2f2;margin-bottom:12px}
.layout .workspace-id strong{color:var(--ov-ink)}
.layout .workspace-id small,.layout .nav-caption,.layout .nav-children a{color:var(--ov-muted)}
.layout .workspace-avatar,.layout .nav-count{background:#d9eafb;color:#275b91}
.layout .nav-children{border-color:var(--ov-line)}
.layout .nav-link:hover,.layout .nav-group summary:hover,
.layout .nav-children a:hover,.layout .help-link:hover{color:var(--ov-accent);background:#e0eefb}
.layout .nav-link.selected{color:#fff;background:var(--ov-accent);border-color:var(--ov-accent)}
.layout .nav-link.selected .icon{color:inherit}
.layout :focus-visible{outline-color:var(--ov-accent)}
.layout .topbar{border:1px solid #fff;border-radius:12px;background:var(--ov-tint);padding:0 12px;height:58px;gap:8px}
.layout .search-shortcut{
  width:clamp(176px,24vw,300px);min-height:40px;padding:0 12px;
  background:#fff;border:1px solid var(--ov-line);color:var(--ov-text);text-align:left
}
.layout .search-shortcut kbd{margin-left:auto;color:var(--ov-muted)}
.layout .search-shortcut.compact-search{width:auto;min-width:38px}
.layout .account-switch .account-meta{color:var(--ov-accent)}
.layout .top-avatar{background:#dfedfb;border-color:#d2e3f5;color:#275b91;border-radius:9px}
.layout .alert-button{background:#fff;color:var(--ov-accent);border-color:var(--ov-line)}
.layout main{padding:18px 0 0}
.layout .page-heading{margin:0 0 14px;gap:12px}
.layout .page-heading h1{font-size:clamp(1.65rem,2.5vw,2.14rem);font-weight:700;color:var(--ov-ink)}
.layout .page-heading p{color:var(--ov-muted)}
.layout .global-filters{gap:8px}
.layout .global-filters .select-control{min-height:40px;border-color:var(--ov-line);background:var(--ov-card);color:var(--ov-text)}
.layout .global-filters select{min-height:38px}
.layout .page-content{gap:12px}
.layout .source-strip{background:#edf5fc;border-color:#f8fbff;color:var(--ov-text);padding:6px 12px;min-height:40px;gap:12px}
.layout .source,.layout .source-cta{font-size:.75rem}
.layout .site-footer{border-color:#cbdaea;padding:12px 0 0;margin-top:14px}
.layout .kpi-grid{
  gap:8px;padding:8px;border:1px solid #fff;border-radius:12px;background:var(--ov-tint);overflow:visible
}
.layout .kpi{
  display:flex;flex-direction:column;min-width:0;min-height:115px;padding:12px;
  background:var(--ov-card);border:1px solid var(--ov-line);border-radius:9px
}
.layout .kpi-label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;color:var(--ov-text);font-size:.84rem}
.layout .kpi-label .icon{color:var(--ov-accent);width:18px;height:18px}
.layout .kpi>strong{margin:auto 0 5px;color:var(--ov-ink);font-size:clamp(1.5rem,2.4vw,2rem);letter-spacing:-.025em}
.layout .kpi-foot{gap:5px;color:var(--ov-muted);font-size:.69rem}
.layout .kpi-delta{padding:2px 6px;border-radius:5px;background:#e7f1fb;color:#355d85;font-size:.75rem}
.layout .kpi-delta.up{color:#216047;background:#e0f2e9}
.layout .kpi-delta.down{color:#962d51;background:#f8e6ee}
.ov-analytics,.ov-details{display:grid;gap:12px;min-width:0}
.ov-analytics{grid-template-columns:repeat(3,minmax(0,1fr))}
.ov-details{grid-template-columns:minmax(238px,.9fr) minmax(0,2.1fr);align-items:start}
.ov-panel{min-width:0;padding:14px;background:var(--ov-tint);border:1px solid #fff;border-radius:12px;color:var(--ov-ink)}
.ov-panel.ov-white{background:var(--ov-card)}
.ov-panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:12px}
.ov-panel-head h2{font-size:.96rem;font-weight:700;line-height:1.35}
.ov-panel-head p{margin-top:3px;color:var(--ov-muted);font-size:.73rem;line-height:1.4}
.ov-link{color:var(--ov-accent);font-size:.75rem;font-weight:650;text-decoration:underline;text-underline-offset:3px}
.ov-legend{display:flex;gap:4px 12px;flex-wrap:wrap;color:var(--ov-muted);font-size:.69rem;margin:8px 0}
.ov-legend span,.ov-ring-key dt{display:flex;gap:6px;align-items:center}
.ov-dot{display:inline-block;width:8px;height:8px;flex:none;border-radius:50%;background:var(--ov-accent)}
.ov-dot.prior{background:var(--ov-prior)}
.ov-dot.web{background:var(--ov-blue)}
.ov-plot{height:116px;position:relative;border-bottom:1px solid #a9bfd5;background:repeating-linear-gradient(to top,transparent 0,transparent calc(25% - 1px),#d6e4f1 calc(25% - 1px),#d6e4f1 25%)}
.ov-chart-area{display:grid;grid-template-columns:32px minmax(0,1fr);gap:6px}
.ov-axis{position:relative;color:var(--ov-muted);font: .67rem Plex,sans-serif;text-align:right}
.ov-axis span{position:absolute;right:0;transform:translateY(-50%)}
.ov-bar-groups{display:grid;grid-template-columns:repeat(var(--ov-groups),minmax(0,1fr));height:100%;gap:8px}
.ov-bar-pair{display:flex;align-items:flex-end;justify-content:center;gap:4px}
.ov-bar{width:clamp(9px,22%,30px);height:var(--height);border-radius:5px 5px 0 0;background:var(--ov-accent)}
.ov-bar.prior{background:var(--ov-prior)}
.ov-bar-labels{display:grid;grid-template-columns:repeat(var(--ov-groups),minmax(0,1fr));margin-left:38px;gap:8px;text-align:center;color:var(--ov-muted);font-size:.68rem;line-height:1.25;margin-top:6px}
.ov-bar-labels strong{display:block;color:var(--ov-ink);font:600 .78rem Plex,sans-serif;margin-bottom:2px}
.ov-ring-content{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:162px}
.ov-ring-key{margin:0;display:grid;gap:12px;min-width:0}
.ov-ring-key dt{font-size:.71rem;color:var(--ov-muted)}
.ov-ring-key dd{margin:2px 0 0 14px;font:600 1.125rem Plex,sans-serif}
.ov-rings{position:relative;width:clamp(92px,11vw,148px);aspect-ratio:1;flex:none;display:grid;place-items:center}
.ov-ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--ring-color) var(--arc),#e0ebf6 0);mask-image:radial-gradient(farthest-side,transparent calc(100% - 9px),black calc(100% - 8px))}
.ov-ring.inner{inset:13px}
.ov-ring-center{text-align:center;color:var(--ov-muted);font-size:.61rem;line-height:1.22}
.ov-ring-center .icon{display:block;width:18px;height:18px;margin:0 auto 4px;color:var(--ov-accent)}
.ov-trend-total{display:flex;align-items:baseline;gap:6px;font-size:.72rem;color:var(--ov-muted)}
.ov-trend-total strong{color:var(--ov-ink);font:600 1.3rem Plex,sans-serif}
.ov-trend-chart .ov-plot{height:106px}
.ov-area{position:absolute;inset:0;clip-path:polygon(var(--points));background:#bad9f7}
.ov-area.prior{background:#ccdeed}
.ov-area.ov-series{background:var(--ov-accent)}
.ov-area.ov-series.prior{background:#62829f}
.ov-trend-ticks{display:flex;justify-content:space-between;gap:4px;margin:5px 0 0 38px;color:var(--ov-muted);font-size:.68rem}
.ov-findings{display:grid;gap:6px}
.ov-finding{
  display:grid;grid-template-columns:28px minmax(0,1fr) 16px;align-items:center;gap:7px;
  width:100%;padding:7px;text-align:left;background:#f8fbff;border:1px solid var(--ov-line);border-radius:8px;color:var(--ov-ink)
}
.ov-finding:first-child{background:#e1effd;border-color:#cfe3f7}
.ov-finding:hover{border-color:#84add8}
.ov-finding-mark{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--ov-accent-light);color:var(--ov-accent)}
.ov-finding strong,.ov-finding small{display:block}
.ov-finding strong{font-size:.74rem;line-height:1.3;font-weight:680}
.ov-finding small{font-size:.68rem;color:var(--ov-muted);margin-top:2px}
.ov-finding>.icon{color:var(--ov-accent)}
.ov-empty-note{color:var(--ov-muted);font-size:.8rem}
.ov-table{overflow:auto;border:1px solid var(--ov-line);border-radius:8px;background:#fbfdff}
.ov-table table{min-width:540px;font-size:.76rem}
.ov-table th,.ov-table td{padding:8px 10px;border-color:#e2ecf5}
.ov-table thead th{background:#e6f0fa;color:var(--ov-text);font-size:.69rem}
.ov-table table .ov-numeric{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ov-table table small{color:var(--ov-muted);font-size:.68rem}
.ov-download{padding:0 8px;min-height:32px;color:var(--ov-accent);border-color:var(--ov-line);font-size:.72rem;background:#fff}
.ov-channel{display:inline-block;padding:2px 7px;border-radius:5px;background:#e0effd;color:#2a5b8e;font-size:.71rem}
.ov-channel.web{background:#e1f1f4;color:#246773}
@media(max-width:1160px){

/* Shared soft blue surfaces and controls. */
.panel,.insight-list,.empty,dialog,.dialog-heading{background:var(--paper)}
.button.primary:hover{background:#235587;border-color:#235587}
.tabs{background:var(--surface)}
.layout .nav-children a[aria-current="page"]{background:#deedfc;color:#24588d;box-shadow:inset 2px 0 var(--brand)}
.layout .alert-button:hover,.layout .top-avatar:hover,.layout .search-shortcut:hover{background:var(--surface)}
.layout .global-filters .select-control:focus-within{outline-color:var(--brand)}
.layout .page-tabs{border-color:#cbdbea}
.stage.leak-stage{background:#e5f1fc;box-shadow:inset 2px 0 var(--brand)}

.leak-workspace{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(232px,1fr);gap:12px}
.leak-panel{min-width:0;padding:16px;background:var(--paper);border:1px solid #fff;border-radius:12px}
.leak-panel.blue{background:var(--surface)}
.leak-panel-header{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.leak-panel-header h2{font-size:1rem;line-height:1.35;color:var(--ink);font-weight:700}
.leak-panel-header p{font-size:.8rem;color:var(--muted);margin-top:4px}
.leak-panel-header .tabs button{min-height:36px}
.leak-stages{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));list-style:none;gap:6px;margin:0;padding:0;container-type:inline-size}
.leak-stages>li{min-width:0;--leak-anchor:0%}
.leak-stages>li:nth-child(n+4){--leak-anchor:100%}
.leak-step{
  position:relative;left:var(--leak-anchor);translate:calc(-1 * var(--leak-anchor)) 0;z-index:var(--leak-layer,auto);
  width:var(--leak-width,100%);height:100%;display:grid;grid-template-rows:minmax(2.6em,auto) auto minmax(119px,1fr);gap:5px;
  padding:8px 6px;text-align:left;border:1px solid var(--border);border-radius:8px;background:var(--leak-background,#f7fbff);color:var(--ink);
  box-shadow:var(--leak-shadow,none);transition:width 150ms ease-out,background-color 140ms ease-out,border-color 140ms ease-out
}
.leak-step:hover{border-color:var(--brand);background:#edf6ff}
.leak-step:focus-visible:not(.hide-leak-history){
  --leak-width:min(300px,100cqi);--leak-layer:2;--leak-show-history:grid;--leak-show-compact:none;
  --leak-background:#edf6ff;--leak-shadow:0 5px 16px #1a2a4026
}
@media(hover:hover){
  .leak-step:hover:not(.hide-leak-history){
    --leak-width:min(300px,100cqi);--leak-layer:3;--leak-show-history:grid;--leak-show-compact:none;
    --leak-background:#edf6ff;--leak-shadow:0 5px 16px #1a2a4026
  }
}
.leak-step-name{font-size:.73rem;line-height:1.25;font-weight:700;align-self:start;overflow-wrap:anywhere}
.leak-step-count{font:600 clamp(.9rem,1.4vw,1.22rem) Plex,sans-serif;font-variant-numeric:tabular-nums}
.leak-step-compact{display:var(--leak-show-compact,grid);align-content:start;gap:5px}
.leak-step-pair{height:69px;display:flex;align-items:end;gap:4px;justify-content:center;border-bottom:1px solid #b4cce3;background:repeating-linear-gradient(to top,transparent 0,transparent calc(25% - 1px),#d7e6f3 calc(25% - 1px),#d7e6f3 25%)}
.leak-step-pair i{display:block;width:32%;max-width:28px;height:var(--height);background:#4683be;border-radius:3px 3px 0 0}
.leak-step-pair i.prior{background:#b6d0e8}
.leak-step-rate{font:600 .82rem Plex,sans-serif;color:var(--brand);margin-top:2px}
.leak-step-caption{font-size:.69rem;line-height:1.3;color:var(--muted);min-height:2.6em}
.leak-history{display:grid;gap:4px;min-width:0;margin:0;color:var(--body)}
.leak-step .leak-history{display:var(--leak-show-history,none);align-content:start;padding-inline:4px}
.leak-history-title{font-size:.73rem;font-weight:700;color:var(--muted)}
.leak-history-grid{display:grid;grid-template-columns:repeat(var(--leak-periods),minmax(0,1fr));gap:4px;text-align:center}
.leak-history-period{display:grid;grid-template-rows:auto var(--leak-bar-size,52px) auto;gap:2px;min-width:0}
.leak-history-value{font:600 .78rem/1.25 Plex,sans-serif;color:var(--ink);white-space:nowrap}
.leak-history-track{display:grid;align-items:end;justify-items:center;border-bottom:1px solid #b4cce3;
  background:repeating-linear-gradient(to top,transparent 0,transparent calc(25% - 1px),#d7e6f3 calc(25% - 1px),#d7e6f3 25%)}
.leak-history-bar{width:min(65%,34px);height:var(--height);background:#a1c2de;border-radius:3px 3px 0 0}
.leak-history-period.is-current .leak-history-bar{background:var(--brand)}
.leak-history-period.is-current .leak-history-date{font-weight:700;color:var(--brand)}
.leak-history-date{font-size:.69rem;line-height:1.25;overflow-wrap:anywhere}
.leak-history-detail{--leak-bar-size:96px;padding:12px;margin-top:12px;background:var(--surface);border:1px solid var(--border);border-radius:8px}
.leak-history-detail .leak-history-title,.leak-history-detail .leak-history-date{font-size:.8rem}
.leak-legend{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:.74rem;color:var(--muted);margin-top:12px}
.leak-legend span{display:flex;align-items:center;gap:5px}
.leak-legend .ov-dot{background:#4683be}
.leak-legend .ov-dot.prior{background:#b6d0e8}
.leak-highlight h3{font-size:1.15rem;letter-spacing:-.017em;line-height:1.35;margin:0 0 8px}
.leak-highlight strong.leak-delta{display:block;font:600 1.8rem/1.16 Plex,sans-serif;color:var(--brand)}
.leak-highlight .leak-delta-label{margin:3px 0 14px;color:var(--muted);font-size:.77rem}
.leak-metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.leak-metrics div{background:var(--paper);border:1px solid var(--border);border-radius:8px;padding:8px}
.leak-metrics dt{font-size:.72rem;color:var(--muted)}
.leak-metrics dd{margin:0;font:600 1.16rem Plex,sans-serif;color:var(--ink)}
.leak-highlight .button{white-space:normal;min-height:40px}
.leak-lower{grid-column:1;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px}
.leak-campaign,.leak-checks,.leak-sources{list-style:none;margin:0;padding:0}
.leak-campaign li+li,.leak-checks li+li,.leak-sources li+li{border-top:1px solid var(--border)}
.leak-campaign li,.leak-checks li,.leak-sources li{padding:9px 0;min-width:0}
.leak-campaign li:first-child,.leak-checks li:first-child,.leak-sources li:first-child{padding-top:0}
.leak-campaign li:last-child,.leak-checks li:last-child,.leak-sources li:last-child{padding-bottom:0}
.leak-campaign b,.leak-checks b,.leak-sources b{display:block;font-size:.8rem}
.leak-campaign small,.leak-sources small,.leak-checks small{display:block;font-size:.73rem;color:var(--muted);line-height:1.4;margin-top:2px}
.leak-campaign-metrics{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;margin-top:4px;font-size:.73rem;color:var(--muted)}
.leak-campaign-metrics strong{font:600 .89rem Plex,sans-serif;color:var(--brand)}
.leak-checks li{display:grid;grid-template-columns:19px minmax(0,1fr);align-items:start;gap:6px}
.leak-checks .icon{color:var(--brand);margin-top:2px}
.leak-sources-footer{margin-top:12px}
@media(max-width:1180px) and (min-width:901px),(max-width:800px){
  .leak-stages{grid-template-columns:repeat(3,minmax(0,1fr))}
  .leak-stages>li:nth-child(3n+1){--leak-anchor:0%}
  .leak-stages>li:nth-child(3n+2){--leak-anchor:50%}
  .leak-stages>li:nth-child(3n){--leak-anchor:100%}
}
@media(max-width:1100px) and (min-width:901px),(max-width:800px){
  .leak-workspace{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .leak-chart,.leak-lower{grid-column:1/-1}
  .leak-lower{grid-row:3}
}
@media(max-width:570px){
  .leak-workspace,.leak-lower{grid-template-columns:minmax(0,1fr)}
  .leak-lower{grid-row:auto}
  .leak-panel{padding:12px}
}
@media(max-width:365px){
  .leak-stages{grid-template-columns:repeat(2,minmax(0,1fr))}
  .leak-stages>li:nth-child(odd){--leak-anchor:0%}
  .leak-stages>li:nth-child(even){--leak-anchor:100%}
}

.pipeline-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--border)}
.pipeline-toolbar h2{display:flex;align-items:center;gap:8px;font-size:.96rem;font-weight:700}
.pipeline-toolbar h2 .icon{color:var(--brand)}
.pipeline-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pipeline-tools .input-control{min-height:38px}
.pipeline-tools .input-control input{min-height:36px}
.pipeline-tools .button{min-height:38px}
.pipeline-count{padding:2px 7px;border-radius:5px;color:var(--muted);background:#e4eff9;font-size:.71rem;white-space:nowrap}
.pipeline-board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:12px}
.pipeline-column{min-width:0;border-radius:9px;background:#f0f6fc;border:1px solid var(--border)}
.pipeline-lane-header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px}
.pipeline-lane-header h3{display:flex;align-items:center;gap:7px;font-size:.875rem;font-weight:700}
.pipeline-dot{width:8px;height:8px;border-radius:50%;background:var(--lead-accent);flex:none}
.lead-cold{--lead-accent:#356cab;--lead-soft:#e0effd}
.lead-warm{--lead-accent:#825604;--lead-soft:#fff1d6}
.lead-hot{--lead-accent:#9b3b2d;--lead-soft:#fce9e3}
.pipeline-lane-cards{display:grid;gap:8px;padding:0 8px 8px;list-style:none;margin:0}
.pipeline-card{
  display:block;width:100%;text-align:left;padding:11px;background:#fff;color:var(--ink);
  border:1px solid var(--border);border-radius:8px;transition:border-color 150ms ease,background-color 150ms ease
}
.pipeline-card:hover{border-color:#85aed4;background:#fafdff}
.pipeline-identity{display:flex;align-items:center;gap:9px;min-width:0}
.pipeline-avatar{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--lead-soft);color:var(--lead-accent);font-size:.79rem;font-weight:700}
.pipeline-identity strong,.pipeline-identity small{display:block;overflow-wrap:anywhere}
.pipeline-identity strong{font-size:.86rem;line-height:1.3}
.pipeline-identity small,.pipeline-line{color:var(--muted);font-size:.74rem}
.pipeline-line{display:flex;align-items:flex-start;gap:7px;margin-top:7px;line-height:1.4}
.pipeline-line .icon{width:14px;height:14px;color:var(--brand);margin-top:1px}
.pipeline-line span{min-width:0;overflow-wrap:anywhere}
.pipeline-empty{margin:0 8px 8px;padding:13px 9px;font-size:.78rem;color:var(--muted);border:1px dashed #bbd2e7;border-radius:8px}
.pipeline-no-results{padding:24px 14px;color:var(--muted);font-size:.85rem}

#dialog.lead-preview{width:min(680px,100%);overscroll-behavior:contain}
#dialog.lead-preview::backdrop{background:#0d192ba3}
.lead-preview .dialog-heading{padding:12px 18px;align-items:center}
.lead-preview .dialog-heading h2{font-size:1rem;letter-spacing:0;margin:0}
.lead-preview .dialog-body{display:grid;gap:15px;padding:16px 18px 24px}
.lead-preview-heading{display:flex;align-items:center;gap:8px}
.lead-preview .dialog-heading .button{min-height:38px}
.lead-summary-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:13px}
.lead-summary-card .pipeline-identity strong{font-size:1.13rem}
.lead-summary-card .pipeline-avatar{width:43px;height:43px}
.lead-summary-grid{display:grid;grid-template-columns:1.45fr .9fr 1.05fr .85fr;gap:8px;margin:12px 0 0;padding-top:11px;border-top:1px solid var(--border)}
.lead-summary-grid>div{min-width:0}
.lead-summary-grid dt{font-size:.72rem;color:var(--muted)}
.lead-summary-grid dd{margin:2px 0 0;font-size:.8rem;font-weight:650;overflow-wrap:anywhere}
.lead-preview-section{min-width:0}
.lead-preview .lead-preview-section h3{margin:0 0 8px;font-size:.93rem}
.lead-temperature{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;list-style:none;padding:4px;margin:0;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.lead-temperature li{display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;padding:6px 3px;line-height:1.3;border:1px solid transparent;border-radius:5px;font-size:.76rem;color:var(--muted)}
.lead-temperature li[aria-current="step"]{color:var(--lead-accent);background:var(--lead-soft);border-color:currentColor;font-weight:700}
.lead-temperature-note{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;margin-top:7px;color:var(--muted);font-size:.74rem}
.lead-evidence{padding:11px 12px;border:1px solid var(--border);border-radius:8px;background:#fff}
.lead-evidence .definitions{margin:0}
.lead-evidence .definitions div:first-child{padding-top:0}
.lead-evidence .definitions div:last-child{padding-bottom:0;border-bottom:0}
.lead-evidence .conversation-trail{margin:0}
.lead-preview-section>p{font-size:.85rem;color:var(--body)}
@media(max-width:690px){
  .pipeline-board{grid-template-columns:1fr}
  .pipeline-lane-cards{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:460px){
  .pipeline-lane-cards{grid-template-columns:1fr}
  .pipeline-tools{width:100%}
  .pipeline-tools .input-control{flex:1;min-width:0}
  .pipeline-tools .input-control input{width:100%}
  .lead-preview .dialog-heading,.lead-preview .dialog-body{padding-inline:12px}
  .lead-summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
.lead-list-layout{display:grid;gap:12px}
.lead-list-controls{display:flex;align-items:center;justify-content:space-between;gap:8px 14px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.lead-list-controls .tabs{gap:4px;max-width:100%;background:none;border:0;border-radius:0;padding:0}
.lead-list-controls .tabs button{display:inline-flex;align-items:center;gap:6px;min-height:41px;padding:6px 9px;border-radius:0;border-bottom:2px solid transparent;background:none;box-shadow:none}
.lead-list-controls .tabs button[aria-pressed="true"]{border-bottom-color:var(--brand);color:var(--brand);font-weight:700}
.lead-list-controls .tabs button:focus-visible{outline-offset:-3px}
.lead-list-controls .tabs button .icon{width:14px;height:14px}
.lead-list-tab-count{font-size:.68rem;line-height:1;padding:3px 5px;border-radius:5px;background:#dfedf9;color:var(--blue)}
.lead-list-controls .button,.lead-table-toolbar .input-control,.lead-table-toolbar .select-control{min-height:36px}
.lead-list-controls .button{margin-bottom:6px}
.lead-table-panel{border-radius:11px;background:#fff}
.lead-table-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap;padding:12px 14px;background:#fff}
.lead-table-toolbar .input-control{background:#f0f6fc;border-color:#e5eff7;min-width:0}
.lead-table-toolbar .input-control input{min-height:34px;width:min(245px,56vw)}
.lead-table-toolbar .select-control select{min-height:34px}
.lead-page-options{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:.77rem}
.lead-table-wrap{overflow:auto;max-width:100%}
.lead-table-wrap:focus-visible{outline-offset:-2px}
.lead-table{min-width:720px;font-size:.81rem}
.lead-table thead th{background:#f3f8fd;border-block:1px solid var(--border);font-size:.75rem;color:var(--body)}
.lead-table th,.lead-table td{padding:9px 13px}
.lead-table tbody tr:hover{background:#f6faff}
.lead-table tbody th{min-width:155px}
.lead-table tbody th .row-link{width:100%;color:var(--ink)}
.lead-table tbody td small,.lead-table tbody th small{display:block;color:var(--muted);font-size:.73rem;font-weight:500;margin-top:2px}
.lead-table .lead-table-response{min-width:138px}
.lead-table .lead-table-source{min-width:145px}
.lead-table-identity .pipeline-avatar{width:34px;height:34px}
.lead-table-identity .pipeline-identity{gap:9px}
.lead-table-action .icon-button{min-width:36px;min-height:36px;color:var(--brand)}
.lead-table th:last-child,.lead-table-action{text-align:center}
.lead-sort{display:inline-flex;align-items:center;gap:5px;border:0;background:none;padding:0;color:inherit;font:inherit;text-align:left}
.lead-sort .icon{width:13px;height:13px}
.lead-sort[aria-pressed="true"]{color:var(--brand)}
.lead-order-mark{font-size:.83rem;color:var(--brand);line-height:1}
.lead-pagination{display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap;padding:10px 12px;border-top:1px solid var(--border)}
.lead-pagination button{min-width:32px;height:32px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--blue);font:600 .75rem Jakarta, sans-serif}
.lead-pagination button:hover:not(:disabled){background:#eaf4fd}
.lead-pagination button[aria-current="page"]{background:#deedfc;border-color:#c4ddef;color:var(--brand)}
.lead-pagination button:disabled{opacity:.48}
.lead-pagination .previous .icon{transform:rotate(180deg)}
.lead-table-empty{padding:24px;text-align:center;border-top:1px solid var(--border);color:var(--muted);font-size:.85rem}
@media(max-width:600px){
  .lead-list-controls{gap:4px}
  .lead-table-toolbar{padding:10px}
  .lead-table-toolbar .input-control{width:100%}
  .lead-table-toolbar .input-control input{width:100%}
  .lead-table th,.lead-table td{padding:8px 10px}
}

/* Analisis kreatif */
.ca-page{display:grid;gap:14px;min-width:0}
.ca-toolbar,.ca-panel-head,.ca-chart-controls,.ca-campaign-title,.ca-gallery-actions{
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap
}
.ca-toolbar .tabs,.ca-chart-controls .tabs{margin:0;max-width:100%;flex-wrap:wrap}
.ca-page .tabs button{min-height:36px;padding:5px 10px;font-size:.81rem}
.ca-page .tabs button[aria-pressed="true"]{background:var(--brand);color:#fff;box-shadow:none}
.ca-context{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:.79rem}
.ca-kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.ca-kpi{
  min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:5px;
  background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:12px
}
.ca-symbol{
  display:grid;place-items:center;flex:none;width:32px;height:32px;border-radius:8px;
  background:var(--ov-accent-light);color:var(--brand)
}
.ca-symbol.teal{background:#e1f1f4;color:#246773}
.ca-symbol.green{background:#e4f5ee;color:var(--green)}
.ca-symbol.orange{background:#fce9e2;color:var(--orange)}
.ca-kpi .ca-symbol{width:28px;height:28px;margin-bottom:3px}
.ca-kpi h2{font-size:.81rem;font-weight:650;color:var(--body);line-height:1.35}
.ca-kpi strong{font:650 clamp(1.24rem,1.85vw,1.75rem)/1.15 Plex,sans-serif;letter-spacing:-.025em;overflow-wrap:anywhere}
.ca-kpi small{font-size:.75rem;color:var(--muted);line-height:1.35}
.ca-main{display:grid;grid-template-columns:minmax(0,2fr) minmax(270px,1fr);gap:12px;align-items:stretch}
.ca-panel{min-width:0;background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:14px}
.ca-panel-heading{display:flex;align-items:flex-start;gap:9px}
.ca-panel-heading h2{font-size:1rem;line-height:1.35;letter-spacing:-.015em}
.ca-panel-heading p{margin-top:3px;color:var(--muted);font-size:.79rem;line-height:1.45}
.ca-panel-head .button{min-height:36px;font-size:.79rem}
.ca-chart-controls{margin:13px 0 8px}
.ca-chart-controls .select-control,.ca-chart-controls select{min-height:36px;font-size:.81rem}
.ca-legend{display:flex;flex-wrap:wrap;gap:5px 14px;margin-bottom:9px;font-size:.76rem;color:var(--muted)}
.ca-legend span{display:inline-flex;align-items:center;gap:6px}
.ca-key{width:15px;border-top:2px solid var(--brand);flex:none}
.ca-key.prior{border-color:#6889ad;border-top-style:dashed}
.ca-chart{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 7px;padding:8px 2px 1px}
.ca-axis{display:flex;flex-direction:column;justify-content:space-between;align-items:end;color:var(--muted);font:400 .75rem/1 Plex,sans-serif;padding-block:0}
.ca-axis span:first-child{transform:translateY(-.4em)}
.ca-axis span:last-child{transform:translateY(.25em)}
.ca-plot{
  position:relative;height:clamp(150px,15vw,220px);min-width:0;margin-inline:6px;
  background:repeating-linear-gradient(to bottom,var(--border) 0 1px,transparent 1px 25%);
  border-bottom:1px solid var(--border);cursor:crosshair;isolation:isolate
}
.ca-plot svg{display:block;width:100%;height:100%;overflow:visible}
.ca-chart-point{position:absolute;inset:0 auto 0 var(--x);display:none;pointer-events:none}
.ca-chart-point.is-current{display:block}
.ca-chart-point::before{content:"";position:absolute;inset:0 auto 0 -1px;border-left:1px solid #88a9ca}
.ca-chart-point i{
  position:absolute;top:var(--y);width:10px;height:10px;transform:translate(-50%,-50%);
  border:2px solid white;border-radius:50%;background:var(--brand);box-shadow:0 0 0 1px var(--brand)
}
.ca-chart-tooltip{
  position:absolute;z-index:1;left:8px;top:7px;width:max-content;max-width:150px;padding:6px 8px;
  border:1px solid var(--border);border-radius:7px;background:var(--paper);
  box-shadow:0 2px 6px #1a2a4012;font-size:.75rem;color:var(--body);line-height:1.45
}
.ca-chart-point.align-right .ca-chart-tooltip{left:auto;right:8px}
.ca-chart-tooltip strong,.ca-chart-tooltip span{display:block}
.ca-chart-tooltip strong{color:var(--ink)}
.ca-ticks{grid-column:2;position:relative;height:1.3em;margin:6px 6px 0;color:var(--muted);font-size:.75rem}
.ca-ticks span{position:absolute;left:var(--x);translate:-50% 0;white-space:nowrap}
.ca-ticks span:first-child{translate:0 0}
.ca-ticks span:last-child{translate:-100% 0}
.ca-campaigns{display:grid;gap:8px;margin-top:13px}
.ca-campaign{
  padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--surface)
}
.ca-campaign-title{align-items:flex-start;gap:4px 8px}
.ca-campaign-title button{border:0;background:none;padding:0;color:var(--ink);font-size:.83rem;font-weight:700;text-align:left}
.ca-campaign-title button:hover{text-decoration:underline;color:var(--brand)}
.ca-campaign-title .chip{font-size:.75rem;min-height:20px;padding:2px 6px}
.ca-campaign>p{color:var(--muted);font-size:.75rem;margin-top:3px}
.ca-campaign-meters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:9px 0 0}
.ca-campaign-meters dt{display:flex;justify-content:space-between;gap:4px;font-size:.75rem;color:var(--body);line-height:1.25}
.ca-campaign-meters dt strong{color:var(--ink);font-family:Plex,sans-serif;font-weight:600;white-space:nowrap}
.ca-campaign-meters dd{height:5px;background:#dce9f6;margin:5px 0 0;border-radius:6px;overflow:hidden}
.ca-campaign-meters dd i{display:block;width:var(--fill);height:100%;background:var(--brand);border-radius:inherit}
.ca-campaign-meters dd i.teal{background:var(--ov-blue)}
.ca-gallery-actions{justify-content:flex-end}
.ca-gallery-actions .icon-button{border-color:var(--border);min-height:34px;min-width:34px;color:var(--brand)}
.ca-gallery-actions .icon-button:disabled{opacity:.42}
.ca-gallery{
  display:grid;grid-auto-flow:column;grid-auto-columns:max(207px,calc((100% - 30px)/4));
  gap:10px;overflow-x:auto;scroll-snap-type:x proximity;margin:12px 0 0;padding:3px 3px 10px;
  list-style:none;scroll-padding-inline:3px;scrollbar-color:#a9c4df var(--surface)
}
.ca-gallery>li{min-width:0;scroll-snap-align:start}
.ca-card{
  min-width:0;width:100%;height:100%;display:flex;flex-direction:column;text-align:left;color:var(--ink);
  border:1px solid var(--border);border-radius:8px;background:var(--paper);padding:0;overflow:hidden
}
.ca-card:hover{border-color:#7ca4cb;background:#f2f8ff}
.ca-card:focus-visible{outline-offset:1px}
.ca-card-info{display:grid;gap:5px;width:100%;padding:9px 10px 10px}
.ca-card-meta{font-size:.75rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ca-card-title{font-size:.9rem;line-height:1.35;min-height:2.7em}
.ca-status{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;min-height:26px}
.ca-status .chip{font-size:.75rem;white-space:normal}
.ca-status small{font-size:.75rem;color:var(--muted)}
.ca-card-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding-top:7px;border-top:1px solid var(--border)}
.ca-card-metrics small,.ca-card-metrics strong{display:block}
.ca-card-metrics small{color:var(--muted);font-size:.75rem;line-height:1.25;overflow-wrap:anywhere}
.ca-card-metrics strong{font:650 .86rem/1.4 Plex,sans-serif;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.ca-thumb{
  width:100%;aspect-ratio:1.85;display:block;margin-top:auto;position:relative;
  background-color:var(--surface);background-position:center;background-size:cover
}

function creativeAnalysis(c) {
  const isWeb = c.campaign === "web";
  const samples = [c.results,c.impressions,isWeb ? 360 : c.leads,c.days];
  const objectives = creativeScope(c);
  const dim = dimensions.map((d, i) => {

  const fatigue = fatigueAnalysis(c);
  const weak = dim.slice(1).some(d=>d.label==="Lemah") || fatigue.status==="Jenuh";
  const status = cost.certainty==="Belum cukup data" ? "Belum cukup data"

    : cost.label==="Lemah" && weak && !c.controlled ? "Pertimbangkan dihentikan"

  return {dim, cost, status, fatigue};
}

function creativeScope(c) {
  return creatives.filter(x=>x.campaign===c.campaign && x.results>=15 && x.days>=7).length;
}

function fatigueAnalysis(c) {
  const [ctr0,ctr1,freq0,freq1,cost0,cost1,days] = c.fatigue;
  const drop = (ctr0-ctr1)/ctr0;
  const watch = drop>=.15 && freq1>freq0;
  const status = c.days<7 ? "Belum cukup data" : watch && drop>=.25 && cost1>cost0 && days>=3 ? "Jenuh" : watch ? "Waspada" : "Sehat";
  return {status, drop, ctr0, ctr1, freq0, freq1, cost0, cost1, days, confound:c.controlled, engagement:c.engagement};
}

function kpis() {
  const current = sumStages(scope()), previous = sumStages(scope(),state.days);
  const wa = sumStages(channelScope("wa")), oldWa = sumStages(channelScope("wa"),state.days);
  const web = sumStages(channelScope("web")), oldWeb = sumStages(channelScope("web"),state.days);
  const hasWa = channelScope("wa").length>0, hasWeb = channelScope("web").length>0;

  const item = (title,currentValue,previousValue,format,symbol,neutral=false) => ({title,value:format(currentValue),delta:relative(currentValue,previousValue),symbol,neutral});
  const items = [
    item("Belanja iklan",current[0],previous[0],money,"layers-2",true),
    item(hasWa && hasWeb ? "Klik semua kanal" : hasWa ? "Klik iklan WhatsApp" : "Klik iklan website",current[2],previous[2],num,"mouse-pointer"),
  ];
  if (hasWa) items.push(item("Percakapan WhatsApp",wa[3],oldWa[3],num,"message-circle"));
  if (hasWeb) items.push(item("Pembelian website",web[6],oldWeb[6],num,"shopping-bag"));
  if (hasWa && !hasWeb) items.push(item("Biaya per percakapan",ratio(wa[0],wa[3]),ratio(oldWa[0],oldWa[3]),money,"message-circle",true));
  if (hasWeb && !hasWa) items.push(item("Biaya per pembelian",ratio(web[0],web[6]),ratio(oldWeb[0],oldWeb[6]),money,"shopping-bag",true));

  return `<section class="kpi-grid" aria-label="Metrik utama">${items.map(item=>{
    const delta = item.delta===null?"Tanpa pembanding":(item.delta>=0?"+":"−")+pct(Math.abs(item.delta));
    const tone = item.neutral||item.delta===null?"neutral":item.delta>=0?"up":"down";
    return `<article class="kpi"><span class="kpi-label">${item.title}${icon(item.symbol)}</span><strong>${item.value}</strong><div class="kpi-foot"><span class="kpi-delta ${tone}">${delta}</span>${item.delta===null?"":"<span>vs periode lalu</span>"}</div></article>`;
  }).join("")}</section>`;
}

function leakEvidence(channel) {
  const current = sumStages(channelScope(channel));
  const previous = sumStages(channelScope(channel),state.days);
  const actual = ratio(current[3],current[2]);
  const baseline = ratio(previous[3],previous[2]);
  return {current,previous,actual,baseline,loss:Math.max(0,Math.round(baseline*current[2]-current[3])),gap:(baseline-actual)*100};
}

function getInsights() {
  if (state.account==="empty") return [];
  const items = [];
  if (channelScope("wa").length) {
    const e = leakEvidence("wa");
    if (e.loss>0) items.push({id:"leak",type:"Funnel Intelligence",icon:"funnel",tone:"peach",tag:"Perlu ditinjau",confidence:"Tinggi",
      title:"Konversi klik ke percakapan WhatsApp turun",
      summary:`${num(e.current[3])} percakapan dari ${num(e.current[2])} klik iklan WhatsApp.`, signal:e,
      copy:`${pct(e.actual)} klik menjadi chat, dari ${pct(e.baseline)} pada periode sebelumnya.`,
      route:"kebocoran",action:"Telusuri kebocoran",detailAction:"Lihat tahap yang bocor",
      evidence:[["Klik link WhatsApp",num(e.current[2])],["Percakapan dimulai",num(e.current[3])],["Selisih konversi","−"+num(e.gap,1)+" poin persentase"],["Perkiraan selisih percakapan",num(e.loss)]],
      next:"Uji pembuka WhatsApp untuk campaign dengan konversi terendah. Periksa apakah tautan dan pesan pembukanya sesuai dengan penawaran iklan."});
    const lead = visibleLeads().find(l=>l.level==="Hot");
    if (lead) items.push({id:"intent",leadId:lead.id,summary:`${lead.prior} ke ${lead.level} · ${lead.type.toLowerCase()} · ${lead.minutes} menit setelah pesan CS`,type:"Audience Intelligence",icon:"users",tone:"blue",tag:"Sinyal niat beli",confidence:lead.confidence,
      title:`${lead.alias} ${lead.id==="WA-4821"?"meminta invoice grosir":"mengonfirmasi paket grosir"}`,copy:`${lead.why} Temperatur lead naik dari ${lead.prior} ke ${lead.level}.`,
      route:"lead",action:"Buka bukti percakapan",detailAction:"Buka percakapan lead",target:lead.id,
      evidence:[["Temperatur",lead.prior+" → "+lead.level],["Bukti chat",lead.quote],["Interval CS → lead",lead.minutes+" menit"]],next:"Periksa chat sumber dan siapkan detail pembayaran di WhatsApp Business."});
  }
  const tired = visibleCreatives().find(c=>fatigueAnalysis(c).status==="Jenuh");
  if (tired) {
    const f=fatigueAnalysis(tired);
    items.push({id:"fatigue",creativeId:tired.id,summary:`CTR turun ${pct(f.drop)} · frekuensi dan biaya per hasil naik selama ${f.days} hari`,type:"Creative Intelligence",icon:"clapperboard",tone:"violet",tag:"Kejenuhan kreatif",confidence:"Sedang",
      title:`Kreatif “${tired.name}” menunjukkan kejenuhan`,copy:`CTR turun ${pct(f.drop)}, sementara frekuensi dan biaya per hasil naik selama ${f.days} hari.`,
      route:"kejenuhan",action:"Periksa sinyal kejenuhan",detailAction:"Lihat detail kejenuhan",
      evidence:[["CTR link",pct(f.ctr0/100)+" → "+pct(f.ctr1/100)],["Frekuensi",num(f.freq0,1)+"× → "+num(f.freq1,1)+"×"],["Biaya per hasil",money(f.cost0)+" → "+money(f.cost1)],["Pembanding","7 hari pertama setelah matang"],["Cakupan waktu","Snapshot kreatif 19 Nov 2026"]],next:"Pertimbangkan menguji hook baru di Ads Manager pada ad set yang sama."});
  }
  if (channelScope("web").length && !channelScope("wa").length) {
    const e = leakEvidence("web");
    const lossPct = 1-e.actual;
    items.push({id:"website",type:"Funnel Intelligence",icon:"globe",tone:"blue",tag:"Periksa jalur website",confidence:"Sedang",
      title:"Sebagian klik belum tercatat sebagai pemuatan halaman",summary:`${num(e.current[3])} pemuatan dari ${num(e.current[2])} klik iklan website.`,signal:e,copy:`${pct(lossPct)} klik belum tercatat sebagai landing page view pada snapshot website.`,
      route:"funnel",action:"Lihat funnel website",
      evidence:[["Klik link",num(e.current[2])],["Landing page view",num(e.current[3])],["Persentase memuat halaman",pct(e.actual)]],next:"Periksa waktu muat katalog dan cakupan event Pixel di perangkat seluler."});
  }
  return items;
}

function insightKey(insight) {
  if (insight.leadId) return insight.id+"-"+insight.leadId;
  if (insight.creativeId) return insight.id+"-"+insight.creativeId;
  return [state.account,state.campaign,state.days,insight.id].join("-");
}
const reviewStatus = insight => state.history[insightKey(insight)];
const unreadCount = () => getInsights().filter(insight=>!reviewStatus(insight)).length;


function previousPeriodLabel() {
  const end=new Date(Date.UTC(2026,10,19-state.days));
  const start=new Date(Date.UTC(2026,10,20-state.days*2));
  const date=new Intl.DateTimeFormat("id-ID",{day:"numeric",month:"short",timeZone:"UTC"});
  return `${date.format(start)} – ${date.format(end)} 2026`;
}
function conversionCue(current,previous,label) {
  const periods=[
    {value:current,label:selectedPeriod().label,className:""},
    {value:previous,label:previousPeriodLabel(),className:"previous"}
  ];
  return `<figure class="conversion-cue"><figcaption class="cue-caption">${label}</figcaption>
    ${periods.map(period=>`<div class="cue-line ${period.className}"><span>${period.label}</span>
      <strong>${safe(formatStageRate(period.value))}</strong><span class="cue-track" aria-hidden="true"><i style="--reach:${Math.min(100,100*(period.value ?? 0))}%"></i></span>
    </div>`).join("")}<div class="cue-scale" aria-hidden="true"><span>0%</span><span>50%</span><span>100%</span></div></figure>`;
}
function insightCard(i, feature=false) {
  return `<article class="insight-row ${feature&&i.signal?"insight-feature":""}"><div class="insight-row-copy"><p class="insight-area">${i.type}</p><h3>${i.title}</h3><p class="insight-evidence">${i.summary||i.copy}${!feature&&i.signal?" · "+pct(i.signal.actual):""}</p></div>
    ${feature&&i.signal?conversionCue(i.signal.actual,i.signal.baseline,i.id==="leak"?"Konversi klik ke percakapan":"Konversi klik ke pemuatan halaman"):""}
    <button data-insight="${i.id}" class="text-button">${i.action}</button></article>`;
}

function overviewCampaigns() {
  return scope().map(campaign=>{
    const current=stageTotals(campaign,state.days);
    const previous=stageTotals(campaign,state.days,state.days);
    const outcome=campaign.channel==="wa"?3:6;
    return {
      campaign,
      spend:current[0],
      clicks:current[2],
      results:current[outcome],
      rate:stageRate(current[outcome],current[2]),
      priorRate:stageRate(previous[outcome],previous[2])
    };
  });
}

function overviewAxis(max,format) {
  return '<div class="ov-axis" aria-hidden="true">'+[0,.5,1].map(fraction=>
    `<span style="top:${100*(1-fraction)}%">${format(max*fraction)}</span>`
  ).join("")+'</div>';
}

function overviewLegend() {
  return '<div class="ov-legend" aria-hidden="true"><span><i class="ov-dot"></i>Periode ini</span><span><i class="ov-dot prior"></i>Periode lalu</span></div>';
}

function campaignConversionPanel(rows) {
  const shortNames={grosir:"Grosir",toko:"Reseller",web:"Katalog"};
  const max=Math.max(.2,Math.ceil(Math.max(...rows.flatMap(row=>[row.rate,row.priorRate]))*5)/5);
  const accessible=rows.map(({campaign,rate,priorRate})=>
    `${campaign.name}, ${formatStageRate(rate)} periode ini dan ${formatStageRate(priorRate)} pada periode lalu.`
  ).join(" ");
  const bars=rows.map(({rate,priorRate})=>`<div class="ov-bar-pair">
    <i class="ov-bar" style="--height:${100*(rate??0)/max}%"></i>
    <i class="ov-bar prior" style="--height:${100*(priorRate??0)/max}%"></i>
  </div>`).join("");
  const labels=rows.map(({campaign,rate})=>
    `<div><strong>${safe(formatStageRate(rate))}</strong>${shortNames[campaign.id]??safe(campaign.name)}</div>`
  ).join("");
  return `<section class="ov-panel" aria-labelledby="ov-campaign-conversion" style="--ov-groups:${rows.length}">
    <header class="ov-panel-head"><div><h2 id="ov-campaign-conversion">Konversi per campaign</h2><p>Klik → percakapan atau pembelian</p></div></header>
    ${overviewLegend()}<div role="img" aria-label="${safe(accessible)}">
      <div class="ov-chart-area" aria-hidden="true">${overviewAxis(max,value=>num(value*100)+"%")}<div class="ov-plot"><div class="ov-bar-groups">${bars}</div></div></div>
      <div class="ov-bar-labels" aria-hidden="true">${labels}</div>
    </div>
  </section>`;
}

function funnelConversionPanel() {
  const labels={wa:"Klik → chat",web:"Klik → halaman"};
  const data=["wa","web"].filter(channel=>channelScope(channel).length).map(channel=>{
    const evidence=leakEvidence(channel);
    return {channel, rate:stageRate(evidence.current[3],evidence.current[2])};
  });
  const keys=data.map(({channel,rate})=>`<div><dt><i class="ov-dot ${channel}" aria-hidden="true"></i>${labels[channel]}</dt><dd>${safe(formatStageRate(rate))}</dd></div>`).join("");
  const rings=data.map(({channel,rate},index)=>`<i class="ov-ring ${index?"inner":""}" style="--arc:${100*Math.min(1,rate??0)}%;--ring-color:var(--ov-${channel==="wa"?"accent":"blue"})"></i>`).join("");
  return `<section class="ov-panel ov-white" aria-labelledby="ov-funnel-conversion">
    <header class="ov-panel-head"><div><h2 id="ov-funnel-conversion">Konversi funnel</h2><p>Langkah pertama setelah klik</p></div><a class="ov-link" href="#funnel">Lihat funnel</a></header>
    <div class="ov-ring-content"><dl class="ov-ring-key">${keys}</dl><div class="ov-rings" aria-hidden="true">${rings}<span class="ov-ring-center">${icon("funnel")}Dari klik</span></div></div>
  </section>`;
}

function dailyClicks(list, offset) {
  return Array.from({length:state.days},(_,index)=>{
    const day=offset+state.days-index-1;
    return list.reduce((total,campaign)=>total+dailyRows[campaign.id][day][2],0);
  });
}

function dailyClickPanel() {
  const list=scope();
  const current=dailyClicks(list,0);
  const previous=dailyClicks(list,state.days);
  const max=Math.max(200,Math.ceil(Math.max(...current,...previous)/200)*200);
  const positions=values=>values.map((value,index)=>[index/(values.length-1)*100,100-(value/max)*100]);
  const polygon=points=>points.map(([x,y])=>`${x}% ${y}%`).join(",");
  const area=points=>polygon([[0,100],...points,[100,100]]);
  const line=points=>polygon([...points,...[...points].reverse().map(([x,y])=>[x,Math.min(100,y+1.6)])]);
  const currentPoints=positions(current);
  const previousPoints=positions(previous);
  const shortDate=offset=>new Intl.DateTimeFormat("id-ID",{day:"numeric",month:"short",timeZone:"UTC"})
    .format(new Date(Date.UTC(2026,10,19-offset)));
  const currentTotal=current.reduce((sum,count)=>sum+count,0);
  const previousTotal=previous.reduce((sum,count)=>sum+count,0);
  const description=`Klik harian. ${selectedPeriod().label}: ${current.map(value=>num(value)).join(", ")}. Periode pembanding ${previousPeriodLabel()}: ${previous.map(value=>num(value)).join(", ")}. Total pembanding ${num(previousTotal)} klik.`;
  return `<section class="ov-panel" aria-labelledby="ov-clicks">
    <header class="ov-panel-head"><div><h2 id="ov-clicks">Tren klik iklan</h2><p>Klik per hari pada campaign terpilih</p></div></header>
    <div class="ov-trend-total"><strong>${num(currentTotal)}</strong> klik periode ini</div>${overviewLegend()}
    <div class="ov-trend-chart" role="img" aria-label="${safe(description)}">
      <div class="ov-chart-area" aria-hidden="true">${overviewAxis(max,num)}<div class="ov-plot">
        <div class="ov-area prior" style="--points:${area(previousPoints)}"></div>
        <div class="ov-area" style="--points:${area(currentPoints)}"></div>
        <div class="ov-area ov-series prior" style="--points:${line(previousPoints)}"></div>
        <div class="ov-area ov-series" style="--points:${line(currentPoints)}"></div>
      </div></div>
      <div class="ov-trend-ticks" aria-hidden="true"><span>${shortDate(state.days-1)}</span><span>${shortDate(Math.floor((state.days-1)/2))}</span><span>${shortDate(0)}</span></div>
    </div>
  </section>`;
}
