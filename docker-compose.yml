services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: funnellens-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3000
      - SECRET=${SECRET:-replace-with-a-long-random-secret}
      - CORS=${CORS:-localhost,127.0.0.1}
      - FRONTEND_URL=${FRONTEND_URL:-http://127.0.0.1:5173}
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=${DATABASE_NAME:-db_testing}
      - DATABASE_USER=${DATABASE_USER:-postgres}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-replace-me}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - MAIL_FROM=${MAIL_FROM:-noreply@localhost}
      - OPEN_WA_URL=http://open_wa:2785
      - OPEN_WA_APP_KEY=${OPEN_WA_APP_KEY:-}
      - OPEN_WA_WEBHOOK_URL=${OPEN_WA_WEBHOOK_URL:-http://host.docker.internal:3000/api/wa/webhook}
      - META_APP_ID=${META_APP_ID:-}
      - META_APP_SECRET=${META_APP_SECRET:-}
      - META_REDIRECT_URI=${META_REDIRECT_URI:-http://localhost:3000/api/meta/oauth/callback}
      - META_API_VERSION=${META_API_VERSION:-v21.0}
      - META_OAUTH_SCOPES=${META_OAUTH_SCOPES:-ads_read,ads_management}
      - GEMINI_API_KEYS=${GEMINI_API_KEYS:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      - ./log:/app/log
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: funnellens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-replace-me}
      POSTGRES_DB: ${DATABASE_NAME:-db_testing}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: funnellens-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  open_wa:
    image: rmyndharis/openwa:latest
    container_name: funnellens-openwa
    profiles: ["whatsapp"]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${OPEN_WA_PORT:-2785}:2785"
    environment:
      - SERVE_DASHBOARD=false
      - ENABLE_SWAGGER=true
      - ENGINE_TYPE=baileys
      - SSRF_ALLOWED_HOSTS=host.docker.internal
    volumes:
      - open_wa_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:2785/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  open_wa_data:
