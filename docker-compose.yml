services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: funnel-lens-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3000
      - SECRET=${SECRET:-super_secret_default_key}
      - CORS=${CORS:-localhost}
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=${DATABASE_NAME:-db_testing}
      - DATABASE_USER=${DATABASE_USER:-postgres}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-postgres}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - MAIL_FROM=${MAIL_FROM:-noreply@example.com}
      - OPEN_WA_URL=http://open_wa:2785
      - OPEN_WA_APP_KEY=${OPEN_WA_APP_KEY:-}
      - OPEN_WA_WEBHOOK_URL=${OPEN_WA_WEBHOOK_URL:-http://host.docker.internal:3000/api/wa/webhook}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:0.5b}
    volumes:
      - ./log:/app/log
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: funnel-lens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-db_testing}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-db_testing}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: funnel-lens-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  open_wa:
    image: rmyndharis/openwa:latest
    container_name: funnel-lens-openwa
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${OPEN_WA_PORT:-2785}:2785"
    environment:
      - SERVE_DASHBOARD=false
      - ENABLE_SWAGGER=true
      # webhook delivery back to the ho\st Elysia; the SSRF guard blocks private targets otherwise
      - SSRF_ALLOWED_HOSTS=host.docker.internal
    volumes:
      - open_wa_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:2785/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    container_name: funnel-lens-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:0.5b}
    volumes:
      - ollama_data:/root/.ollama
    entrypoint:
      - /bin/sh
      - -c
      - |
        /bin/ollama serve &
        pid=$$!
        until /bin/ollama list > /dev/null 2>&1; do
          sleep 1
        done
        echo "Pulling model $${OLLAMA_MODEL}..."
        /bin/ollama pull "$${OLLAMA_MODEL}"
        wait $$pid

volumes:
  postgres_data:
  redis_data:
  open_wa_data:
  ollama_data: