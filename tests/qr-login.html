<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paste Base64 ke QR WhatsApp</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f0f2f5;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        h2 {
            font-size: 19px;
            color: #111b21;
            margin-bottom: 6px;
            text-align: center;
        }

        .subtitle {
            font-size: 13px;
            color: #54656f;
            text-align: center;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 14px;
        }

        textarea {
            width: 100%;
            height: 110px;
            padding: 12px;
            border: 2px solid #d1d7db;
            border-radius: 10px;
            font-family: monospace;
            font-size: 12px;
            color: #111b21;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: #25d366;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-paste {
            background-color: #25d366;
            color: #ffffff;
        }

        .btn-clear {
            background-color: #e9edef;
            color: #3b4a54;
            flex: 0.4;
        }

        .qr-box {
            width: 100%;
            min-height: 260px;
            border: 2px dashed #d1d7db;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background-color: #fafafa;
        }

        .qr-box.has-qr {
            border-style: solid;
            border-color: #25d366;
            background-color: #ffffff;
        }

        .qr-box img {
            width: 230px;
            height: 230px;
            object-fit: contain;
            display: none;
        }

        .qr-box.has-qr img {
            display: block;
        }

        .placeholder-text {
            font-size: 13px;
            color: #8696a0;
            text-align: center;
        }

        .qr-box.has-qr .placeholder-text {
            display: none;
        }

        .status {
            margin-top: 12px;
            font-size: 12px;
            text-align: center;
            color: #54656f;
        }

        .status.error {
            color: #ea0038;
            font-weight: 500;
        }

        .status.success {
            color: #128c7e;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>QR Login WhatsApp</h2>
    <p class="subtitle">Tempel JSON <code>{ "code": "..." }</code> atau string Base64 di bawah</p>

    <div class="input-group">
      <textarea
              id="base64Input"
              placeholder='Paste di sini... Contoh: { "code": "data:image/png;base64,iVBORw0..." }'
      ></textarea>
    </div>

    <div class="btn-row">
        <button class="btn-paste" id="pasteBtn">Tempel dari Clipboard</button>
        <button class="btn-clear" id="clearBtn">Hapus</button>
    </div>

    <div class="qr-box" id="qrBox">
        <span class="placeholder-text">Gambar QR akan muncul otomatis di sini</span>
        <img id="qrImg" alt="QR Code WhatsApp" />
    </div>

    <div class="status" id="statusText">Menunggu input...</div>
</div>

<script>
    const input = document.getElementById('base64Input');
    const qrBox = document.getElementById('qrBox');
    const qrImg = document.getElementById('qrImg');
    const statusText = document.getElementById('statusText');
    const pasteBtn = document.getElementById('pasteBtn');
    const clearBtn = document.getElementById('clearBtn');

    function renderQR(rawText) {
        const trimmed = rawText.trim();
        if (!trimmed) {
            resetUI();
            return;
        }

        let base64Str = trimmed;

        // 1. Jika input berupa JSON, ambil properti code / qr / base64
        try {
            const parsed = JSON.parse(trimmed);
            base64Str = parsed.code || parsed.qr || parsed.base64 || parsed.data || '';
        } catch (e) {
            // Jika bukan JSON, bersihkan tanda kutip jika user menyalin bagian value-nya saja
            base64Str = trimmed.replace(/^["']|["']$/g, '');
        }

        if (!base64Str) {
            showError('Key "code" tidak ditemukan dalam JSON.');
            return;
        }

        // 2. Tambahkan prefix data:image jika yang ditempel hanya kode Base64 mentah
        if (!base64Str.startsWith('data:image')) {
            base64Str = 'data:image/png;base64,' + base64Str;
        }

        qrImg.src = base64Str;
    }

    qrImg.onload = () => {
        qrBox.classList.add('has-qr');
        statusText.textContent = 'QR siap di-scan!';
        statusText.className = 'status success';
    };

    qrImg.onerror = () => {
        qrBox.classList.remove('has-qr');
        showError('Format Base64 tidak valid atau gambar rusak.');
    };

    function showError(msg) {
        qrBox.classList.remove('has-qr');
        statusText.textContent = msg;
        statusText.className = 'status error';
    }

    function resetUI() {
        input.value = '';
        qrImg.removeAttribute('src');
        qrBox.classList.remove('has-qr');
        statusText.textContent = 'Menunggu input...';
        statusText.className = 'status';
    }

    // Event saat mengetik atau Ctrl+V manual
    input.addEventListener('input', () => renderQR(input.value));

    // Tombol Paste 1-klik dari Clipboard
    pasteBtn.addEventListener('click', async () => {
        try {
            const text = await navigator.clipboard.readText();
            input.value = text;
            renderQR(text);
        } catch (err) {
            input.focus();
            showError('Izin clipboard ditolak browser. Silakan klik kotak teks lalu tekan Ctrl+V.');
        }
    });

    // Tombol Hapus
    clearBtn.addEventListener('click', resetUI);
</script>

</body>
</html>
